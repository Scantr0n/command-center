<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/vendor/d3.min.js"></script>
<style>
  :root {
    --void: #08090A;
    --panel: #101215;
    --panelLight: #16181C;
    --hairline: rgba(255,255,255,0.07);
    --hairlineHover: rgba(255,255,255,0.14);
    --ink: #F5F6F7;
    --sub: #9A9FA6;
    --faint: #565B62;
  }
  body { background: var(--void); }
  .hairline { border-color: var(--hairline) !important; }
  .hairline:hover { border-color: var(--hairlineHover) !important; }
  .cluster-card { transition: transform 0.15s ease, border-color 0.15s ease; }
  .cluster-card:hover { transform: translateY(-3px); }
  .status-dot { box-shadow: 0 0 8px currentColor; }
  #chatMessages::-webkit-scrollbar { width: 6px; }
  #chatMessages::-webkit-scrollbar-thumb { background: #23262b; border-radius: 3px; }

  /* Graph */
  #graphSvg { aspect-ratio: 1 / 1; }
  .graph-node { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform 0.18s ease; }
  .graph-node:hover { transform: scale(1.12); }
  .graph-node:hover .node-glow { opacity: 0.95; }
  .node-glow { opacity: 0.4; transition: opacity 0.18s ease; }
  .node-glow-active { animation: pulseGlow 2.8s ease-in-out infinite; }
  @keyframes pulseGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
  .spoke-line { opacity: 0.5; }
  .hub-node text, .graph-node text { pointer-events: none; user-select: none; }
  .view-toggle-btn { transition: all 0.15s ease; }
  .view-toggle-btn.active { background: var(--ink); color: var(--void); }
  .view-toggle-btn:not(.active) { background: transparent; color: var(--sub); }
  .attn-pill { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 4px 10px; border-radius: 999px; border-width: 1px; border-style: solid; background: rgba(255,255,255,0.03); cursor: pointer; display: inline-flex; align-items: center; transition: background 0.15s ease; }
  .attn-pill:hover { background: rgba(255,255,255,0.08); }
  .attn-card { transition: border-color 0.15s ease, transform 0.15s ease; cursor: pointer; }
  .attn-card:hover { transform: translateX(2px); }
  .tag-chip { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 8px; border-radius: 5px; letter-spacing: 0.3px; }

  /* Atmosphere: faint radar grid + vignette behind the graph, restrained not gimmicky */
  #graphView {
    position: relative;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 48px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 48px),
      radial-gradient(circle at center, rgba(255,255,255,0.04) 0%, transparent 65%);
    border-radius: 16px;
  }
  .search-input { transition: border-color 0.15s ease, background 0.15s ease; }
  .search-input:focus { border-color: var(--hairlineHover) !important; }
  .graph-node.dimmed, .cluster-card.dimmed { opacity: 0.16; }
  .graph-node.matched .node-glow, .cluster-card.matched { opacity: 1; }
  .cat-label { cursor: pointer; }
  .corner-notch { position: relative; }
  .corner-notch::before, .corner-notch::after {
    content: ''; position: absolute; width: 10px; height: 10px; border-color: var(--hairlineHover); pointer-events: none;
  }
  .corner-notch::before { top: -1px; left: -1px; border-top: 1.5px solid; border-left: 1.5px solid; }
  .corner-notch::after { bottom: -1px; right: -1px; border-bottom: 1.5px solid; border-right: 1.5px solid; }
</style>
</head>
<body class="min-h-screen font-sans" style="color: var(--ink)">
  <div class="max-w-7xl mx-auto px-6 py-10">
    <header class="mb-7 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-display font-800 text-3xl" style="letter-spacing: -0.02em; color: var(--ink)">COMMAND CENTER</h1>
        <p class="text-sm mt-1 font-mono" style="color: var(--sub)">Jack Scanlon, every project in one view</p>
      </div>
      <div class="flex items-center gap-4">
        <input id="searchInput" type="text" placeholder="Search projects..."
          class="search-input text-xs font-mono rounded-lg px-3 py-1.5 border hairline focus:outline-none"
          style="background: var(--panelLight); color: var(--ink); width: 160px">
        <div id="statsRow" class="flex items-center gap-5 text-right"></div>
        <div class="flex items-center border rounded-lg overflow-hidden font-mono text-xs hairline">
          <button id="viewGraphBtn" class="view-toggle-btn active px-3 py-1.5">Graph</button>
          <button id="viewGridBtn" class="view-toggle-btn px-3 py-1.5">Grid</button>
        </div>
      </div>
    </header>

    <div id="attnCompact" class="hidden flex-wrap items-center gap-2 mb-4"></div>
    <div id="attnCards" class="hidden flex-col gap-2 mb-6"></div>

    <div class="flex items-center gap-4 text-[10px] font-mono mb-2 flex-wrap" style="color: var(--faint)">
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full inline-block" style="background:#3DDC84"></span>Active</span>
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full inline-block" style="background:#4A9EDB"></span>Done</span>
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full inline-block" style="background:#E0A030"></span>Stalled</span>
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full inline-block" style="background:#E04A4A"></span>Broken</span>
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full inline-block" style="background:#565B62"></span>Unknown</span>
      <span style="color: var(--hairlineHover)">|</span>
      <span>Closer to hub = higher priority &middot; Dashed ring = top priority &middot; Grouped by category</span>
    </div>

    <div id="graphView" class="flex items-center justify-center py-4">
      <svg id="graphSvg" viewBox="0 0 900 900" width="900" height="900" class="w-full" style="max-width: 760px; height: auto;"></svg>
    </div>

    <div id="clusterGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <div class="mt-10 pt-6 border-t hairline">
      <h2 class="text-xs font-mono tracking-wide mb-3" style="color: var(--faint)">RECENT ACTIVITY, ACROSS ALL PROJECTS</h2>
      <div id="activityFeed" class="flex flex-col gap-1.5"></div>
    </div>
  </div>

  <!-- Detail / Chat Modal -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-6">
    <div class="corner-notch rounded-xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden border hairline" style="background: var(--panel)">
      <div class="flex items-center justify-between px-6 py-4 border-b hairline">
        <div class="flex items-center gap-3">
          <div id="modalDot" class="w-3 h-3 rounded-full status-dot"></div>
          <h2 id="modalTitle" class="font-display font-700 text-lg"></h2>
        </div>
        <button id="closeModal" class="text-xl leading-none" style="color: var(--sub)">&times;</button>
      </div>
      <div class="px-6 py-4 border-b hairline">
        <div class="flex items-center gap-2 mb-3 flex-wrap">
          <span id="modalStatusPill" class="tag-chip"></span>
          <span id="modalCategoryPill" class="tag-chip" style="background: rgba(255,255,255,0.05); color: var(--sub)"></span>
          <span id="modalPriorityPill" class="tag-chip hidden" style="background: rgba(255,255,255,0.05); color: var(--sub)">TOP PRIORITY</span>
          <span id="modalUpdated" class="text-xs font-mono ml-auto" style="color: var(--faint)"></span>
        </div>
        <p id="modalSummary" class="text-sm leading-relaxed" style="color: var(--sub)"></p>
        <div id="toggleRow" class="hidden mt-3 flex items-center gap-2">
          <label class="text-xs font-mono" style="color: var(--sub)">Automation:</label>
          <button id="toggleBtn" class="text-xs font-mono px-3 py-1 rounded border hairline"></button>
        </div>
      </div>
      <div id="chatMessages" class="flex-1 overflow-y-auto px-6 py-4 space-y-3 text-sm"></div>
      <div class="px-6 py-4 border-t hairline flex gap-2">
        <input id="chatInput" type="text" placeholder="Ask about this project..."
          class="flex-1 rounded-lg px-3 py-2 text-sm focus:outline-none border hairline"
          style="background: var(--panelLight); color: var(--ink)">
        <button id="sendChat" class="font-medium text-sm px-4 py-2 rounded-lg" style="background: var(--ink); color: var(--void)">Send</button>
      </div>
    </div>
  </div>

<script>
let clusters = [];
let activeCluster = null;
let chatHistory = [];
let currentView = 'graph';

const CATEGORY_ORDER = ['Ventures & Business', 'Trading', 'Content', 'Reselling', 'School & Career', 'Health & Personal', 'Travel & Logistics', 'Personal & Infra', 'Uncategorized'];
const CATEGORY_COLOR = {
  'Ventures & Business': '#D9A441',
  'Trading': '#3DDC84',
  'Content': '#8B7FD9',
  'Reselling': '#D97B41',
  'School & Career': '#4F9FD9',
  'Health & Personal': '#D9527A',
  'Travel & Logistics': '#41C9C2',
  'Personal & Infra': '#8A93A6',
  'Uncategorized': '#565B62'
};

function categoryColor(cat) { return CATEGORY_COLOR[cat] || CATEGORY_COLOR['Uncategorized']; }

function statusColor(status) {
  return {
    active: '#3DDC84', done: '#4A9EDB', stalled: '#E0A030',
    broken: '#E04A4A', unknown: '#565B62'
  }[status] || '#565B62';
}

function pillStyle(status) {
  const c = statusColor(status);
  return `background: ${c}1F; color: ${c};`;
}

async function loadClusters() {
  const res = await fetch('/api/clusters');
  const data = await res.json();
  clusters = data.clusters.sort((a, b) => {
    const order = { top: 0, normal: 1, low: 2 };
    return (order[a.priority] ?? 1) - (order[b.priority] ?? 1);
  });
  renderStats();
  renderAttention();
  renderGraph();
  renderGrid();
  renderActivityFeed();
}

function renderActivityFeed() {
  const feed = document.getElementById('activityFeed');
  const dated = clusters.filter(c => c.lastUpdate).sort((a, b) => b.lastUpdate.localeCompare(a.lastUpdate));
  if (!dated.length) { feed.innerHTML = `<p class="text-xs" style="color: var(--faint)">Nothing dated yet.</p>`; return; }
  feed.innerHTML = dated.slice(0, 10).map(c => {
    const color = categoryColor(c.category);
    return `
      <div class="flex items-center gap-3 py-1.5 cursor-pointer" data-id="${c.id}">
        <span class="text-[10px] font-mono flex-shrink-0" style="color: var(--faint); width: 92px">${relativeTime(c.lastUpdate)}</span>
        <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" style="background: ${color}"></span>
        <span class="text-xs font-medium flex-shrink-0" style="color: var(--ink)">${c.name}</span>
        <span class="text-xs truncate" style="color: var(--sub)">${c.summary}</span>
      </div>
    `;
  }).join('');
  feed.querySelectorAll('[data-id]').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.id));
  });
}

function renderStats() {
  const active = clusters.filter(c => c.status === 'active').length;
  const attention = clusters.filter(c => c.status === 'stalled' || c.status === 'broken').length;
  const dated = clusters.filter(c => c.lastUpdate).map(c => c.lastUpdate).sort().reverse();
  const lastSync = dated[0] || 'n/a';
  document.getElementById('statsRow').innerHTML = `
    <div><div class="font-display font-700 text-lg leading-none">${clusters.length}</div><div class="text-[10px] font-mono mt-1 tracking-wide" style="color:var(--faint)">PROJECTS</div></div>
    <div><div class="font-display font-700 text-lg leading-none" style="color:${statusColor('active')}">${active}</div><div class="text-[10px] font-mono mt-1 tracking-wide" style="color:var(--faint)">ACTIVE</div></div>
    <div><div class="font-display font-700 text-lg leading-none" style="color:${attention ? statusColor('broken') : 'var(--faint)'}">${attention}</div><div class="text-[10px] font-mono mt-1 tracking-wide" style="color:var(--faint)">NEEDS ATTN</div></div>
    <div><div class="font-display font-700 text-lg leading-none" style="color:var(--sub)">${lastSync}</div><div class="text-[10px] font-mono mt-1 tracking-wide" style="color:var(--faint)">LAST SYNC</div></div>
  `;
}

function renderAttention() {
  const flagged = clusters.filter(c => c.status === 'stalled' || c.status === 'broken');
  const compact = document.getElementById('attnCompact');
  const cards = document.getElementById('attnCards');

  if (!flagged.length) {
    compact.classList.add('hidden'); compact.classList.remove('flex'); compact.innerHTML = '';
    cards.classList.add('hidden'); cards.classList.remove('flex'); cards.innerHTML = '';
    return;
  }

  compact.innerHTML = `
    <span class="text-[10px] font-mono tracking-wide mr-1" style="color:var(--faint)">NEEDS ATTENTION</span>
    ${flagged.map(c => `
      <button class="attn-pill" data-id="${c.id}" style="border-color:${statusColor(c.status)}66; color:${statusColor(c.status)}">
        <span class="w-1.5 h-1.5 rounded-full inline-block mr-1.5" style="background:${statusColor(c.status)}"></span>${c.name}
      </button>
    `).join('')}
  `;
  cards.innerHTML = flagged.map(c => `
    <div class="attn-card flex items-center gap-3 rounded-lg px-4 py-3 border" data-id="${c.id}" style="border-color:${statusColor(c.status)}40; background: rgba(255,255,255,0.02)">
      <div class="w-2 h-2 rounded-full flex-shrink-0 status-dot" style="background:${statusColor(c.status)}; color:${statusColor(c.status)}"></div>
      <div class="min-w-0 flex-1">
        <div class="font-display font-700 text-sm" style="color: var(--ink)">${c.name}</div>
        <div class="text-xs truncate" style="color: var(--sub)">${c.summary}</div>
      </div>
      <span class="tag-chip flex-shrink-0" style="${pillStyle(c.status)}">${c.status}</span>
    </div>
  `).join('');

  [...compact.querySelectorAll('.attn-pill'), ...cards.querySelectorAll('.attn-card')].forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.id));
  });

  updateAttentionVisibility();
}

function updateAttentionVisibility() {
  const flagged = clusters.some(c => c.status === 'stalled' || c.status === 'broken');
  const compact = document.getElementById('attnCompact');
  const cards = document.getElementById('attnCards');
  if (!flagged) return;
  compact.classList.toggle('hidden', currentView !== 'graph');
  compact.classList.toggle('flex', currentView === 'graph');
  cards.classList.toggle('hidden', currentView !== 'grid');
  cards.classList.toggle('flex', currentView === 'grid');
}

function truncateLabel(name, max = 16) {
  return name.length > max ? name.slice(0, max - 1) + '…' : name;
}

function groupByCategory(list) {
  const map = {};
  list.forEach(c => {
    const cat = c.category || 'Uncategorized';
    (map[cat] = map[cat] || []).push(c);
  });
  const keys = [
    ...CATEGORY_ORDER.filter(k => map[k]),
    ...Object.keys(map).filter(k => !CATEGORY_ORDER.includes(k))
  ];
  return keys.map(k => ({ category: k, items: map[k] }));
}

function priorityOrbit(priority) {
  return priority === 'top' ? 235 : priority === 'low' ? 345 : 295;
}

function nodeRadius(priority) {
  return priority === 'top' ? 34 : priority === 'low' ? 22 : 28;
}

function renderGraph() {
  const svg = d3.select('#graphSvg');
  const cx = 450, cy = 450, hubR = 65;
  const groups = groupByCategory(clusters);
  const totalWeight = groups.reduce((s, g) => s + g.items.length, 0) || 1;

  // Compute each node's *target* position (sector angle + priority-based radius),
  // then let a short-lived D3 force simulation nudge nodes apart so none overlap,
  // while staying pulled toward that target. This is the actual fix for nodes
  // crowding into each other at 20+ projects instead of hand-tuned angle math.
  const simNodes = [];
  let angleCursor = -Math.PI / 2;
  const sectorMeta = [];

  groups.forEach(g => {
    const span = (2 * Math.PI) * (g.items.length / totalWeight);
    const wedgeStart = angleCursor;
    const wedgeEnd = angleCursor + span;
    sectorMeta.push({ category: g.category, wedgeStart, wedgeEnd, mid: (wedgeStart + wedgeEnd) / 2 });

    const innerStart = g.items.length > 1 ? wedgeStart + span * 0.16 : sectorMeta[sectorMeta.length - 1].mid;
    const innerEnd = g.items.length > 1 ? wedgeEnd - span * 0.16 : innerStart;
    const step = g.items.length > 1 ? (innerEnd - innerStart) / (g.items.length - 1) : 0;

    g.items.forEach((c, idx) => {
      const angle = g.items.length > 1 ? innerStart + idx * step : sectorMeta[sectorMeta.length - 1].mid;
      const r = priorityOrbit(c.priority);
      simNodes.push({
        ...c,
        targetX: cx + r * Math.cos(angle),
        targetY: cy + r * Math.sin(angle),
        radius: nodeRadius(c.priority)
      });
    });
    angleCursor = wedgeEnd;
  });

  const sim = d3.forceSimulation(simNodes)
    .force('x', d3.forceX(d => d.targetX).strength(0.35))
    .force('y', d3.forceY(d => d.targetY).strength(0.35))
    .force('collide', d3.forceCollide(d => d.radius + 22).strength(1))
    .stop();
  for (let i = 0; i < 220; i++) sim.tick();

  let sectorHtml = '', spokesHtml = '', nodesHtml = '';

  sectorMeta.forEach(s => {
    const divX = cx + 420 * Math.cos(s.wedgeStart);
    const divY = cy + 420 * Math.sin(s.wedgeStart);
    const divHx = cx + hubR * Math.cos(s.wedgeStart);
    const divHy = cy + hubR * Math.sin(s.wedgeStart);
    sectorHtml += `<line x1="${divHx.toFixed(1)}" y1="${divHy.toFixed(1)}" x2="${divX.toFixed(1)}" y2="${divY.toFixed(1)}" stroke="var(--hairline)" stroke-width="1" stroke-dasharray="3,5" />`;
    const labX = cx + 400 * Math.cos(s.mid);
    const labY = cy + 400 * Math.sin(s.mid);
    sectorHtml += `<text class="cat-label" data-category="${s.category}" x="${labX.toFixed(1)}" y="${labY.toFixed(1)}" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="var(--faint)" letter-spacing="1" opacity="0.85">${s.category.toUpperCase()}</text>`;
  });

  let relationsHtml = '';
  const seenPairs = new Set();

  simNodes.forEach(c => {
    const nx = c.x, ny = c.y;
    const hx = cx + hubR * ((nx - cx) / Math.hypot(nx - cx, ny - cy) || 0);
    const hy = cy + hubR * ((ny - cy) / Math.hypot(nx - cx, ny - cy) || 0);
    const color = categoryColor(c.category);
    spokesHtml += `<line class="spoke-line" x1="${hx.toFixed(1)}" y1="${hy.toFixed(1)}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${color}" stroke-opacity="0.3" stroke-width="1.5" />`;

    // Real cross-project relationships only (e.g. Lifting Tracker relays into
    // Macro Tracker) — not decorative, only drawn when a cluster's own data
    // actually declares a relatedTo link.
    (c.relatedTo || []).forEach(otherId => {
      const pairKey = [c.id, otherId].sort().join('|');
      if (seenPairs.has(pairKey)) return;
      seenPairs.add(pairKey);
      const other = simNodes.find(n => n.id === otherId);
      if (!other) return;
      const midX = (nx + other.x) / 2 + (ny - other.y) * 0.12;
      const midY = (ny + other.y) / 2 + (other.x - nx) * 0.12;
      relationsHtml += `<path d="M${nx.toFixed(1)},${ny.toFixed(1)} Q${midX.toFixed(1)},${midY.toFixed(1)} ${other.x.toFixed(1)},${other.y.toFixed(1)}" fill="none" stroke="var(--sub)" stroke-width="1" stroke-dasharray="1,4" opacity="0.5" />`;
    });

    const r = c.radius;
    const sColor = statusColor(c.status);
    const dx = nx + (r + 3) * 0.7;
    const dy = ny - (r + 3) * 0.7;
    const stale = c.lastUpdate && (Date.now() - new Date(c.lastUpdate + 'T00:00:00')) / 86400000 > 30;

    nodesHtml += `
      <g class="graph-node" data-id="${c.id}">
        <title>${c.name}, ${c.status}, updated ${relativeTime(c.lastUpdate)}${stale ? ' (stale, over a month untouched)' : ''}</title>
        <circle class="node-glow${c.status === 'active' ? ' node-glow-active' : ''}" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="${r + 6}" fill="${color}" opacity="0.16" />
        <circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="${r}" fill="${color}20" stroke="${color}" stroke-width="1.5" ${stale ? 'stroke-dasharray="4,3"' : ''} />
        <circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="4.5" fill="${sColor}" stroke="var(--void)" stroke-width="1.5" opacity="${stale ? 0.45 : 1}" />
        ${c.priority === 'top' ? `<circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="${r + 5}" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2,3" opacity="0.7" />` : ''}
        <text x="${nx.toFixed(1)}" y="${(ny + 3.5).toFixed(1)}" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="${r > 30 ? 9 : 8}" fill="var(--ink)" font-weight="500">${truncateLabel(c.name.split(' ')[0], 9)}</text>
      </g>
    `;
  });

  const hubHtml = `
    <circle cx="${cx}" cy="${cy}" r="${hubR}" fill="var(--panel)" stroke="var(--hairlineHover)" stroke-width="1.5" class="hub-node" />
    <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="13" fill="var(--ink)" letter-spacing="0.5">COMMAND</text>
    <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="13" fill="var(--ink)" letter-spacing="0.5">CENTER</text>
  `;

  svg.html(sectorHtml + spokesHtml + relationsHtml + hubHtml + nodesHtml);
  svg.selectAll('.graph-node').on('click', function() {
    openModal(this.getAttribute('data-id'));
  });
  svg.selectAll('.cat-label').on('click', function() {
    const cat = this.getAttribute('data-category');
    activeCategory = activeCategory === cat ? null : cat;
    applyFilters();
  });
  applyFilters();
}

let searchTerm = '';
let activeCategory = null;

function applyFilters() {
  const term = searchTerm.trim().toLowerCase();
  document.querySelectorAll('.graph-node, .cluster-card').forEach(el => {
    const id = el.dataset.id;
    const c = clusters.find(x => x.id === id);
    if (!c) return;
    const matchesSearch = !term || c.name.toLowerCase().includes(term) || (c.category || '').toLowerCase().includes(term);
    const matchesCategory = !activeCategory || c.category === activeCategory;
    const matches = matchesSearch && matchesCategory;
    const anyFilterActive = !!term || !!activeCategory;
    el.classList.toggle('dimmed', anyFilterActive && !matches);
    el.classList.toggle('matched', anyFilterActive && matches);
  });
  document.querySelectorAll('.cat-label').forEach(el => {
    const isActive = activeCategory === el.getAttribute('data-category');
    el.setAttribute('fill', isActive ? 'var(--ink)' : 'var(--faint)');
    el.setAttribute('opacity', !activeCategory || isActive ? '1' : '0.4');
  });
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  applyFilters();
});

function relativeTime(dateStr) {
  if (!dateStr) return 'no date on record';
  const days = Math.floor((Date.now() - new Date(dateStr + 'T00:00:00')) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return '1 day ago';
  if (days < 30) return `${days} days ago`;
  const months = Math.floor(days / 30);
  return months === 1 ? '1 month ago' : `${months} months ago`;
}

function renderGrid() {
  const grid = document.getElementById('clusterGrid');
  grid.innerHTML = clusters.map(c => {
    const color = categoryColor(c.category);
    return `
    <div class="cluster-card cursor-pointer rounded-xl p-5 border hairline" style="background: var(--panel)" data-id="${c.id}">
      <div class="flex items-center justify-between mb-3">
        <span class="tag-chip" style="background:${color}1F; color:${color}">${(c.category || 'Uncategorized').toUpperCase()}</span>
        <div class="w-2.5 h-2.5 rounded-full status-dot" style="background: ${statusColor(c.status)}; color: ${statusColor(c.status)}"></div>
      </div>
      <h3 class="font-display font-700 text-base mb-1" style="color: var(--ink)">${c.name}${c.priority === 'top' ? ' <span style=\'font-size:9px;color:var(--faint);font-family:monospace;letter-spacing:0.5px;vertical-align:middle\'>&nbsp;TOP</span>' : ''}</h3>
      <p class="text-xs leading-snug line-clamp-3" style="color: var(--sub)">${c.summary}</p>
      <div class="mt-3 flex items-center justify-between">
        <span class="tag-chip" style="${pillStyle(c.status)}">${c.status}</span>
        ${c.toggleable ? `<span class="text-[10px] font-mono" style="color: ${c.enabled ? '#3DDC84' : 'var(--faint)'}">${c.enabled ? 'ON' : 'OFF'}</span>` : ''}
      </div>
    </div>
  `;
  }).join('');

  document.querySelectorAll('.cluster-card').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.id));
  });
}

function setView(view) {
  currentView = view;
  document.getElementById('graphView').classList.toggle('hidden', view !== 'graph');
  document.getElementById('clusterGrid').classList.toggle('hidden', view !== 'grid');
  document.getElementById('viewGraphBtn').classList.toggle('active', view === 'graph');
  document.getElementById('viewGridBtn').classList.toggle('active', view === 'grid');
  updateAttentionVisibility();
}
document.getElementById('viewGraphBtn').addEventListener('click', () => setView('graph'));
document.getElementById('viewGridBtn').addEventListener('click', () => setView('grid'));

function openModal(id) {
  activeCluster = clusters.find(c => c.id === id);
  chatHistory = [];
  const color = categoryColor(activeCluster.category);
  document.getElementById('modalDot').style.background = statusColor(activeCluster.status);
  document.getElementById('modalDot').style.color = statusColor(activeCluster.status);
  document.getElementById('modalTitle').textContent = activeCluster.name;
  document.getElementById('modalTitle').style.color = color;
  document.getElementById('modalStatusPill').textContent = activeCluster.status;
  document.getElementById('modalStatusPill').className = 'tag-chip';
  document.getElementById('modalStatusPill').setAttribute('style', pillStyle(activeCluster.status));
  document.getElementById('modalCategoryPill').textContent = (activeCluster.category || 'Uncategorized').toUpperCase();
  document.getElementById('modalCategoryPill').setAttribute('style', `background:${color}1F; color:${color}`);
  document.getElementById('modalPriorityPill').classList.toggle('hidden', activeCluster.priority !== 'top');
  document.getElementById('modalUpdated').textContent = activeCluster.lastUpdate ? `${activeCluster.lastUpdate} (${relativeTime(activeCluster.lastUpdate)})` : 'no date on record';
  document.getElementById('modalSummary').textContent = activeCluster.summary;
  document.getElementById('chatMessages').innerHTML = '';

  const toggleRow = document.getElementById('toggleRow');
  if (activeCluster.toggleable) {
    toggleRow.classList.remove('hidden');
    toggleRow.classList.add('flex');
    updateToggleBtn();
  } else {
    toggleRow.classList.add('hidden');
    toggleRow.classList.remove('flex');
  }

  document.getElementById('modalOverlay').classList.remove('hidden');
  document.getElementById('modalOverlay').classList.add('flex');
}

function updateToggleBtn() {
  const btn = document.getElementById('toggleBtn');
  btn.textContent = activeCluster.enabled ? 'ON, click to disable' : 'OFF, click to enable';
  btn.style.color = activeCluster.enabled ? '#3DDC84' : 'var(--sub)';
}

document.getElementById('toggleBtn').addEventListener('click', async () => {
  const newState = !activeCluster.enabled;
  const res = await fetch(`/api/toggles/${activeCluster.toggleId}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled: newState })
  });
  const data = await res.json();
  activeCluster.enabled = data.enabled;
  updateToggleBtn();
  loadClusters();
});

document.getElementById('closeModal').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalOverlay').classList.remove('flex');
});

function appendMessage(role, text) {
  const div = document.createElement('div');
  div.className = role === 'user' ? 'text-right' : 'text-left';
  const bg = role === 'user' ? 'background: var(--ink); color: var(--void);' : 'background: var(--panelLight); color: var(--ink);';
  div.innerHTML = `<span class="inline-block px-3 py-2 rounded-lg max-w-[85%]" style="${bg}">${text}</span>`;
  document.getElementById('chatMessages').appendChild(div);
  document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !activeCluster) return;
  input.value = '';
  appendMessage('user', text);
  chatHistory.push({ role: 'user', content: text });

  try {
    const res = await fetch(`/api/clusters/${activeCluster.id}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chatHistory })
    });
    const data = await res.json();
    if (data.text) {
      appendMessage('assistant', data.text);
      chatHistory.push({ role: 'assistant', content: data.text });
    } else {
      appendMessage('assistant', 'Error reaching the assistant.');
    }
  } catch (e) {
    appendMessage('assistant', 'Error reaching the assistant.');
  }
}

document.getElementById('sendChat').addEventListener('click', sendChat);
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat();
});

document.addEventListener('keydown', (e) => {
  const modalOpen = !document.getElementById('modalOverlay').classList.contains('hidden');
  if (e.key === 'Escape' && modalOpen) {
    document.getElementById('modalOverlay').classList.add('hidden');
    document.getElementById('modalOverlay').classList.remove('flex');
    return;
  }
  if (e.key === '/' && document.activeElement.id !== 'searchInput' && document.activeElement.id !== 'chatInput') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

loadClusters();
setInterval(loadClusters, 30000);
</script>
</body>
</html>
