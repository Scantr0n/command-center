<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { background: #0A0B0D; }
  .cluster-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .cluster-card:hover { transform: translateY(-4px); }
  .status-dot { box-shadow: 0 0 8px currentColor; }
  #chatMessages::-webkit-scrollbar { width: 6px; }
  #chatMessages::-webkit-scrollbar-thumb { background: #2A2E35; border-radius: 3px; }

  /* Radial graph */
  .graph-node { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform 0.18s ease; }
  .graph-node:hover { transform: scale(1.1); }
  .graph-node:hover .node-glow { opacity: 0.9; }
  .node-glow { opacity: 0.45; transition: opacity 0.18s ease; }
  .spoke-line { transition: stroke-opacity 0.18s ease; }
  .graph-node:hover ~ .spoke-line { stroke-opacity: 1; }
  .hub-node text, .graph-node text { pointer-events: none; user-select: none; }
  .view-toggle-btn { transition: all 0.15s ease; }
  .view-toggle-btn.active { background: #E8E9EB; color: #0A0B0D; }
  .view-toggle-btn:not(.active) { background: transparent; color: #8B909A; }
</style>
</head>
<body class="min-h-screen font-sans text-ink">
  <div class="max-w-7xl mx-auto px-6 py-10">
    <header class="mb-8 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-display font-800 text-3xl tracking-tight text-ink">COMMAND CENTER</h1>
        <p class="text-sub text-sm mt-1 font-mono">Jack Scanlon — every project, one view</p>
      </div>
      <div class="flex items-center gap-6">
        <div id="statsRow" class="flex items-center gap-5 text-right"></div>
        <div class="flex items-center border border-border rounded-lg overflow-hidden font-mono text-xs">
          <button id="viewGraphBtn" class="view-toggle-btn active px-3 py-1.5">Graph</button>
          <button id="viewGridBtn" class="view-toggle-btn px-3 py-1.5">Grid</button>
        </div>
      </div>
    </header>

    <div id="graphView" class="flex items-center justify-center py-4">
      <svg id="graphSvg" viewBox="0 0 800 800" class="w-full max-w-[720px] h-auto"></svg>
    </div>

    <div id="clusterGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>

  <!-- Detail / Chat Modal -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-6">
    <div class="bg-panel border border-border rounded-xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 border-b border-border">
        <div class="flex items-center gap-3">
          <div id="modalDot" class="w-3 h-3 rounded-full status-dot"></div>
          <h2 id="modalTitle" class="font-display font-700 text-lg"></h2>
        </div>
        <button id="closeModal" class="text-sub hover:text-ink text-xl leading-none">&times;</button>
      </div>
      <div class="px-6 py-4 border-b border-border">
        <div class="flex items-center justify-between mb-2">
          <span id="modalStatusPill" class="text-xs font-mono px-2 py-1 rounded"></span>
          <span id="modalUpdated" class="text-xs text-faint font-mono"></span>
        </div>
        <p id="modalSummary" class="text-sm text-sub leading-relaxed"></p>
        <div id="toggleRow" class="hidden mt-3 flex items-center gap-2">
          <label class="text-xs font-mono text-sub">Automation:</label>
          <button id="toggleBtn" class="text-xs font-mono px-3 py-1 rounded border border-border"></button>
        </div>
      </div>
      <div id="chatMessages" class="flex-1 overflow-y-auto px-6 py-4 space-y-3 text-sm"></div>
      <div class="px-6 py-4 border-t border-border flex gap-2">
        <input id="chatInput" type="text" placeholder="Ask about this project..."
          class="flex-1 bg-panelLight border border-border rounded-lg px-3 py-2 text-sm text-ink placeholder-faint focus:outline-none focus:border-sub">
        <button id="sendChat" class="bg-ink text-void font-medium text-sm px-4 py-2 rounded-lg">Send</button>
      </div>
    </div>
  </div>

<script>
let clusters = [];
let activeCluster = null;
let chatHistory = [];
let currentView = 'graph';

function statusColor(status) {
  return {
    active: '#3DDC84', done: '#4A9EDB', stalled: '#E0A030',
    broken: '#E04A4A', unknown: '#565B64'
  }[status] || '#565B64';
}

function pillStyle(status) {
  const c = statusColor(status);
  return `background: ${c}20; color: ${c};`;
}

async function loadClusters() {
  const res = await fetch('/api/clusters');
  const data = await res.json();
  clusters = data.clusters.sort((a, b) => {
    const order = { top: 0, normal: 1, low: 2 };
    return (order[a.priority] ?? 1) - (order[b.priority] ?? 1);
  });
  renderStats();
  renderGraph();
  renderGrid();
}

function renderStats() {
  const active = clusters.filter(c => c.status === 'active').length;
  const attention = clusters.filter(c => c.status === 'stalled' || c.status === 'broken').length;
  const dated = clusters.filter(c => c.lastUpdate).map(c => c.lastUpdate).sort().reverse();
  const lastSync = dated[0] || '—';
  document.getElementById('statsRow').innerHTML = `
    <div><div class="font-display font-700 text-lg text-ink leading-none">${clusters.length}</div><div class="text-[10px] font-mono text-faint mt-1 tracking-wide">PROJECTS</div></div>
    <div><div class="font-display font-700 text-lg leading-none" style="color:${statusColor('active')}">${active}</div><div class="text-[10px] font-mono text-faint mt-1 tracking-wide">ACTIVE</div></div>
    <div><div class="font-display font-700 text-lg leading-none" style="color:${attention ? statusColor('broken') : '#565B64'}">${attention}</div><div class="text-[10px] font-mono text-faint mt-1 tracking-wide">NEEDS ATTN</div></div>
    <div><div class="font-display font-700 text-lg text-sub leading-none">${lastSync}</div><div class="text-[10px] font-mono text-faint mt-1 tracking-wide">LAST SYNC</div></div>
  `;
}

function truncateLabel(name, max = 16) {
  return name.length > max ? name.slice(0, max - 1) + '…' : name;
}

function renderGraph() {
  const svg = document.getElementById('graphSvg');
  const cx = 400, cy = 400, hubR = 62, orbitR = 290;
  const n = clusters.length;
  const angleStep = n ? (2 * Math.PI) / n : 0;
  const startAngle = -Math.PI / 2;

  let html = '';

  // Spokes first (render under nodes)
  clusters.forEach((c, i) => {
    const angle = startAngle + i * angleStep;
    const nx = cx + orbitR * Math.cos(angle);
    const ny = cy + orbitR * Math.sin(angle);
    const hx = cx + hubR * Math.cos(angle);
    const hy = cy + hubR * Math.sin(angle);
    html += `<line class="spoke-line" x1="${hx.toFixed(1)}" y1="${hy.toFixed(1)}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${c.color}" stroke-opacity="0.35" stroke-width="1.5" />`;
  });

  // Hub
  html += `
    <circle cx="${cx}" cy="${cy}" r="${hubR}" fill="#14161A" stroke="#2A2E35" stroke-width="1.5" class="hub-node" />
    <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="13" fill="#E8E9EB" letter-spacing="0.5">COMMAND</text>
    <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="13" fill="#E8E9EB" letter-spacing="0.5">CENTER</text>
  `;

  // Cluster nodes
  clusters.forEach((c, i) => {
    const angle = startAngle + i * angleStep;
    const nx = cx + orbitR * Math.cos(angle);
    const ny = cy + orbitR * Math.sin(angle);
    const r = c.priority === 'top' ? 38 : c.priority === 'low' ? 26 : 32;
    const sColor = statusColor(c.status);
    const dotAngle = angle - 0.6;
    const dx = nx + (r + 3) * Math.cos(dotAngle);
    const dy = ny + (r + 3) * Math.sin(dotAngle);
    const labelY = ny + r + 16;

    html += `
      <g class="graph-node" data-id="${c.id}">
        <circle class="node-glow" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="${r + 6}" fill="${c.color}" opacity="0.18" />
        <circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="${r}" fill="${c.color}22" stroke="${c.color}" stroke-width="1.75" />
        <circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="5" fill="${sColor}" stroke="#0A0B0D" stroke-width="1.5" />
        ${c.priority === 'top' ? `<circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="${r + 5}" fill="none" stroke="${c.color}" stroke-width="1" stroke-dasharray="2,3" opacity="0.7" />` : ''}
        <text x="${nx.toFixed(1)}" y="${(ny + 4).toFixed(1)}" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E8E9EB" font-weight="500">${truncateLabel(c.name.split(' ')[0], 10)}</text>
        <text x="${nx.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#8B909A">${truncateLabel(c.name)}</text>
      </g>
    `;
  });

  svg.innerHTML = html;
  svg.querySelectorAll('.graph-node').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.id));
  });
}

function renderGrid() {
  const grid = document.getElementById('clusterGrid');
  grid.innerHTML = clusters.map(c => `
    <div class="cluster-card cursor-pointer bg-panel border rounded-xl p-5" style="border-color: ${c.color}40" data-id="${c.id}">
      <div class="flex items-center justify-between mb-3">
        <div class="w-2.5 h-2.5 rounded-full status-dot" style="background: ${statusColor(c.status)}; color: ${statusColor(c.status)}"></div>
        ${c.priority === 'top' ? '<span class="text-[10px] font-mono text-faint tracking-wider">TOP PRIORITY</span>' : ''}
      </div>
      <h3 class="font-display font-700 text-base mb-1" style="color: ${c.color}">${c.name}</h3>
      <p class="text-xs text-sub leading-snug line-clamp-3">${c.summary}</p>
      <div class="mt-3 flex items-center justify-between">
        <span class="text-[10px] font-mono px-2 py-0.5 rounded" style="${pillStyle(c.status)}">${c.status}</span>
        ${c.toggleable ? `<span class="text-[10px] font-mono" style="color: ${c.enabled ? '#3DDC84' : '#565B64'}">${c.enabled ? 'ON' : 'OFF'}</span>` : ''}
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.cluster-card').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.id));
  });
}

function setView(view) {
  currentView = view;
  document.getElementById('graphView').classList.toggle('hidden', view !== 'graph');
  document.getElementById('clusterGrid').classList.toggle('hidden', view !== 'grid');
  document.getElementById('viewGraphBtn').classList.toggle('active', view === 'graph');
  document.getElementById('viewGridBtn').classList.toggle('active', view === 'grid');
}
document.getElementById('viewGraphBtn').addEventListener('click', () => setView('graph'));
document.getElementById('viewGridBtn').addEventListener('click', () => setView('grid'));

function openModal(id) {
  activeCluster = clusters.find(c => c.id === id);
  chatHistory = [];
  document.getElementById('modalDot').style.background = statusColor(activeCluster.status);
  document.getElementById('modalDot').style.color = statusColor(activeCluster.status);
  document.getElementById('modalTitle').textContent = activeCluster.name;
  document.getElementById('modalTitle').style.color = activeCluster.color;
  document.getElementById('modalStatusPill').textContent = activeCluster.status;
  document.getElementById('modalStatusPill').className = 'text-xs font-mono px-2 py-1 rounded';
  document.getElementById('modalStatusPill').setAttribute('style', pillStyle(activeCluster.status));
  document.getElementById('modalUpdated').textContent = activeCluster.lastUpdate ? `Updated ${activeCluster.lastUpdate}` : '';
  document.getElementById('modalSummary').textContent = activeCluster.summary;
  document.getElementById('chatMessages').innerHTML = '';

  const toggleRow = document.getElementById('toggleRow');
  if (activeCluster.toggleable) {
    toggleRow.classList.remove('hidden');
    toggleRow.classList.add('flex');
    updateToggleBtn();
  } else {
    toggleRow.classList.add('hidden');
    toggleRow.classList.remove('flex');
  }

  document.getElementById('modalOverlay').classList.remove('hidden');
  document.getElementById('modalOverlay').classList.add('flex');
}

function updateToggleBtn() {
  const btn = document.getElementById('toggleBtn');
  btn.textContent = activeCluster.enabled ? 'ON — click to disable' : 'OFF — click to enable';
  btn.style.color = activeCluster.enabled ? '#3DDC84' : '#8B909A';
}

document.getElementById('toggleBtn').addEventListener('click', async () => {
  const newState = !activeCluster.enabled;
  const res = await fetch(`/api/toggles/${activeCluster.toggleId}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled: newState })
  });
  const data = await res.json();
  activeCluster.enabled = data.enabled;
  updateToggleBtn();
  loadClusters();
});

document.getElementById('closeModal').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalOverlay').classList.remove('flex');
});

function appendMessage(role, text) {
  const div = document.createElement('div');
  div.className = role === 'user'
    ? 'text-right'
    : 'text-left';
  div.innerHTML = `<span class="inline-block px-3 py-2 rounded-lg max-w-[85%] ${role === 'user' ? 'bg-ink text-void' : 'bg-panelLight text-ink'}">${text}</span>`;
  document.getElementById('chatMessages').appendChild(div);
  document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !activeCluster) return;
  input.value = '';
  appendMessage('user', text);
  chatHistory.push({ role: 'user', content: text });

  try {
    const res = await fetch(`/api/clusters/${activeCluster.id}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chatHistory })
    });
    const data = await res.json();
    if (data.text) {
      appendMessage('assistant', data.text);
      chatHistory.push({ role: 'assistant', content: data.text });
    } else {
      appendMessage('assistant', 'Error reaching the assistant.');
    }
  } catch (e) {
    appendMessage('assistant', 'Error reaching the assistant.');
  }
}

document.getElementById('sendChat').addEventListener('click', sendChat);
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat();
});

loadClusters();
</script>
</body>
</html>
