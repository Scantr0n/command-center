<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090A">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Command Center</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/vendor/d3-force-selection.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --void: #08090A;
    --panel: #101215;
    --panelLight: #16181C;
    --hairline: rgba(255,255,255,0.07);
    --hairlineHover: rgba(255,255,255,0.14);
    --ink: #F5F6F7;
    --sub: #9A9FA6;
    --faint: #7C838C;
  }
  body { background: var(--void); }
  .hairline { border-color: var(--hairline) !important; }
  .hairline:hover { border-color: var(--hairlineHover) !important; }
  .cluster-card { transition: transform 0.15s ease, border-color 0.15s ease; }
  .cluster-card:hover { transform: translateY(-3px); }
  .status-dot { box-shadow: 0 0 8px currentColor; }
  #chatMessages::-webkit-scrollbar { width: 6px; }
  #chatMessages::-webkit-scrollbar-thumb { background: #23262b; border-radius: 3px; }

  /* Graph */
  #graphSvg { aspect-ratio: 1 / 1; }
  .graph-node { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform 0.18s ease; }
  .graph-node:hover { transform: scale(1.12); }
  .graph-node:hover .node-glow { opacity: 0.95; }
  .node-glow { opacity: 0.4; transition: opacity 0.18s ease; }
  .node-glow-active { animation: pulseGlow 2.8s ease-in-out infinite; }
  @keyframes pulseGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
  .spoke-line { opacity: 0.5; }
  .hub-node text, .graph-node text { pointer-events: none; user-select: none; }
  .view-toggle-btn { transition: all 0.15s ease; }
  .view-toggle-btn.active { background: var(--ink); color: var(--void); }
  .view-toggle-btn:not(.active) { background: transparent; color: var(--sub); }
  .attn-pill { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 4px 10px; border-radius: 999px; border-width: 1px; border-style: solid; background: rgba(255,255,255,0.03); cursor: pointer; display: inline-flex; align-items: center; transition: background 0.15s ease; }
  .attn-pill:hover { background: rgba(255,255,255,0.08); }
  .attn-card { transition: border-color 0.15s ease, transform 0.15s ease; cursor: pointer; }
  .attn-card:hover { transform: translateX(2px); }
  .cluster-card:focus-visible, .attn-card:focus-visible, .activity-row:focus-visible {
    outline: 1.5px solid var(--hairlineHover);
    outline-offset: 2px;
  }
  .activity-row { border-radius: 6px; }
  .tag-chip { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 8px; border-radius: 5px; letter-spacing: 0.3px; }
  .cat-filter-chip { cursor: pointer; transition: opacity 0.15s ease; border: none; }
  .cat-filter-chip:hover { opacity: 0.8; }
  .kbd-chip { font-family: 'JetBrains Mono', monospace; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--hairline); background: rgba(255,255,255,0.03); }
  #paletteBtn:hover { border-color: var(--hairlineHover) !important; }

  /* Quick-jump palette: same overlay chrome as the project modal, but a
     single scrollable list of every project instead of a fixed layout, since
     the whole point is jumping straight to one out of 20+ without hunting
     through the graph or grid first. */
  .palette-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; cursor: pointer; }
  .palette-item[aria-selected="true"] { background: rgba(255,255,255,0.06); }
  .palette-item-name { color: var(--ink); font-weight: 500; font-size: 13px; flex-shrink: 0; }
  .palette-item-cat { color: var(--sub); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.3px; margin-left: auto; white-space: nowrap; }
  .palette-item-status { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; padding: 2px 7px; border-radius: 999px; flex-shrink: 0; }
  #paletteResults::-webkit-scrollbar { width: 6px; }
  #paletteResults::-webkit-scrollbar-thumb { background: #23262b; border-radius: 3px; }

  /* On a narrow viewport, 9 wrapped category chips push the graph/grid
     several screens down before any project is visible. Below the point
     wrapping stops being cheap (tablet-ish and up keep the original wrapped
     grid), scroll the row horizontally instead, same one-line-of-filters
     pattern as any mobile category rail. flex-shrink:0 keeps a chip from
     getting squeezed as the row scrolls; the native scrollbar hidden since
     a partially cut-off chip at the edge is enough of a scroll affordance
     without an extra visible bar. */
  @media (max-width: 640px) {
    #categoryFilterRow {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    #categoryFilterRow::-webkit-scrollbar { display: none; }
    #categoryFilterRow .tag-chip { flex-shrink: 0; }
  }

  /* Atmosphere: faint radar grid + vignette behind the graph, restrained not gimmicky */
  #graphView {
    position: relative;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 48px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 48px),
      radial-gradient(circle at center, rgba(255,255,255,0.04) 0%, transparent 65%);
    border-radius: 16px;
  }
  .search-input { transition: border-color 0.15s ease, background 0.15s ease; }
  .search-input:focus { border-color: var(--hairlineHover) !important; }
  /* Same "/" -focuses-search hint GitHub's own search box shows, so the
     shortcut the keydown handler below already implements is actually
     discoverable instead of only working for someone who already knew. */
  #searchKbdHint {
    padding: 1px 5px;
    border-radius: 4px;
    border: 1px solid var(--hairline);
    background: rgba(255,255,255,0.03);
  }
  #chatInput:disabled, #sendChat:disabled, #toggleBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .graph-node.dimmed, .cluster-card.dimmed { opacity: 0.16; }
  .graph-node.matched .node-glow, .cluster-card.matched { opacity: 1; }
  .cat-label { cursor: pointer; }
  .corner-notch { position: relative; }
  .corner-notch::before, .corner-notch::after {
    content: ''; position: absolute; width: 10px; height: 10px; border-color: var(--hairlineHover); pointer-events: none;
  }
  .corner-notch::before { top: -1px; left: -1px; border-top: 1.5px solid; border-left: 1.5px solid; }
  .corner-notch::after { bottom: -1px; right: -1px; border-bottom: 1.5px solid; border-right: 1.5px solid; }
  .skeleton-pulse { animation: skeletonPulse 1.4s ease-in-out infinite; }
  @keyframes skeletonPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }
  #linkRow { text-decoration: none; transition: background 0.15s ease, border-color 0.15s ease; }
  #linkRow:hover { background: rgba(255,255,255,0.06); border-color: var(--hairlineHover) !important; }

  @media (prefers-reduced-motion: reduce) {
    .node-glow-active { animation: none; opacity: 0.7; }
    .skeleton-pulse { animation: none; opacity: 0.7; }
    .graph-node, .cluster-card, .attn-card, .view-toggle-btn, .search-input, #linkRow, .node-glow {
      transition: none !important;
    }
    .graph-node:hover, .cluster-card:hover { transform: none; }
  }

  /* Below ~768px, shrinking the 900x900 viewBox to fit the screen makes node
     labels a few px tall and unreadable. Keep the graph at a legible fixed
     size instead and let #graphScroll (not #graphView, so the hint below
     keeps its own containing block and does not scroll off with the graph)
     pan it horizontally, centered on the hub. */
  .graph-scroll-hint { display: none; }
  @media (max-width: 767px) {
    #graphScroll {
      overflow-x: auto;
      justify-content: flex-start;
      -webkit-overflow-scrolling: touch;
    }
    #graphSvg {
      width: 640px !important;
      max-width: none !important;
      flex-shrink: 0;
    }
    .graph-scroll-hint {
      display: block;
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--faint);
      background: var(--panel);
      border: 1px solid var(--hairline);
      padding: 3px 9px;
      border-radius: 999px;
      pointer-events: none;
    }
  }

  /* Printed status report: same "flip the shared --ink/--sub/--panel/--hairline
     custom properties to a light print theme" trick as the rest of this file
     relies on for dark-mode styling, which is enough to re-color almost every
     inline style="color: var(--ink)"-type rule in the page for free. Only the
     per-category/per-status hex colors computed at render time (tag-chip,
     status-dot, activity-feed dots) sit outside that variable system and need
     their own override below. The graph has no meaningful printed form (a
     circular node layout means nothing on paper), so printing always forces
     the grid + needs-attention list + activity feed regardless of whichever
     view is on screen, same "ignore the current view, print the list" rule
     CSM/Garage/CGT/Sondrik already use. */
  @media print {
    :root {
      --void: #ffffff; --panel: #ffffff; --panelLight: #ffffff;
      --hairline: #cccccc; --hairlineHover: #999999;
      --ink: #111111; --sub: #444444; --faint: #666666;
    }
    body { background: #fff; }
    .max-w-7xl { max-width: none; padding: 0.3in 0.4in; }

    #searchWrap, #paletteBtn, #printBtn, #viewToggleGroup, #errorBanner,
    #filterStatus, #attnCompact, #statusLegend, #categoryFilterRow,
    #noResultsMsg, #graphView, #gridToolbar, #modalOverlay, #paletteOverlay {
      display: none !important;
    }

    #clusterGrid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; }
    .cluster-card { break-inside: avoid; box-shadow: none !important; transform: none !important; }

    #attnCards { display: flex !important; }
    .attn-card { break-inside: avoid; }

    .tag-chip { background: none !important; color: #111 !important; border: 1px solid #999 !important; }
    .status-dot, .activity-row > span.rounded-full { display: none !important; }
    #statsRow, #statsRow * { color: #111 !important; }
    .cluster-card span[style*="3DDC84"] { color: #111 !important; }
  }
</style>
</head>
<body class="min-h-screen font-sans" style="color: var(--ink)">
  <div class="max-w-7xl mx-auto px-6 py-10">
    <header class="mb-7 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-display font-800 text-3xl" style="letter-spacing: -0.02em; color: var(--ink)">COMMAND CENTER</h1>
        <p class="text-sm mt-1 font-mono" style="color: var(--sub)">Jack Scanlon, every project in one view</p>
      </div>
      <div class="flex flex-wrap items-center justify-end gap-3 sm:gap-4">
        <div id="searchWrap" class="relative">
          <input id="searchInput" type="text" placeholder="Search projects..." aria-label="Search projects"
            class="search-input text-xs font-mono rounded-lg pl-3 pr-6 py-1.5 border hairline focus:outline-none w-[175px] sm:w-[190px]"
            style="background: var(--panelLight); color: var(--ink)">
          <button id="searchClearBtn" type="button" aria-label="Clear search" tabindex="-1"
            class="hidden absolute inset-y-0 right-1.5 flex items-center text-sm leading-none"
            style="color: var(--faint)">&times;</button>
          <kbd id="searchKbdHint" aria-hidden="true"
            class="absolute inset-y-0 right-1.5 flex items-center text-[10px] font-mono leading-none pointer-events-none"
            style="color: var(--faint)">/</kbd>
        </div>
        <button id="paletteBtn" type="button" aria-label="Jump to a project"
          class="hidden sm:flex items-center gap-1.5 text-xs font-mono px-2.5 py-1.5 rounded-lg border hairline"
          style="color: var(--sub); background: var(--panelLight)">
          <span>Jump to</span>
          <kbd class="kbd-chip text-[10px]" style="color: var(--sub)" aria-hidden="true">&#8984;K</kbd>
        </button>
        <div id="statsRow" class="flex items-center gap-3 sm:gap-5 text-right"></div>
        <div id="viewToggleGroup" class="flex items-center border rounded-lg overflow-hidden font-mono text-xs hairline" role="group" aria-label="View">
          <button id="viewGraphBtn" class="view-toggle-btn active px-3 py-1.5" aria-pressed="true">Graph</button>
          <button id="viewGridBtn" class="view-toggle-btn px-3 py-1.5" aria-pressed="false">Grid</button>
        </div>
        <button id="printBtn" type="button" aria-label="Print a project status report"
          class="hidden sm:flex items-center gap-1.5 text-xs font-mono px-2.5 py-1.5 rounded-lg border hairline"
          style="color: var(--sub); background: var(--panelLight)">Print</button>
      </div>
    </header>

    <main>
    <div id="errorBanner" class="hidden text-xs font-mono px-3 py-2 rounded-lg mb-4" role="alert" style="background: #E04A4A1A; color: #E0807A; border: 1px solid #E04A4A40"></div>
    <div id="filterStatus" class="sr-only" role="status" aria-live="polite"></div>

    <div id="attnCompact" class="hidden flex-wrap items-center gap-2 mb-4"></div>
    <div id="attnCards" class="hidden flex-col gap-2 mb-6"></div>

    <div id="statusLegend" class="flex items-center gap-4 text-[10px] font-mono mb-2 flex-wrap" style="color: var(--faint)">
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full inline-block" style="background:#3DDC84"></span>Active</span>
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full inline-block" style="background:#4A9EDB"></span>Done</span>
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full inline-block" style="background:#E0A030"></span>Stalled</span>
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full inline-block" style="background:#E35959"></span>Broken</span>
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full inline-block" style="background:#838992"></span>Unknown</span>
      <span style="color: var(--hairlineHover)">|</span>
      <span>Closer to hub = higher priority &middot; Dashed ring = top priority &middot; Grouped by category</span>
    </div>

    <div id="categoryFilterRow" class="flex flex-wrap items-center gap-2 mb-4" role="group" aria-label="Filter by category"></div>

    <div id="noResultsMsg" class="hidden items-center justify-between gap-3 rounded-lg px-4 py-3 border hairline mb-4 text-sm" style="background: rgba(255,255,255,0.02); color: var(--sub)">
      <span id="noResultsText"></span>
      <button type="button" id="clearFiltersBtn" class="text-xs font-mono px-3 py-1.5 rounded border hairline flex-shrink-0" style="color: var(--ink)">Clear filters</button>
    </div>

    <div id="graphView" style="position: relative;">
      <div id="graphScroll" class="flex items-center justify-center py-4">
        <svg id="graphSvg" viewBox="0 0 900 900" width="900" height="900" class="w-full" style="max-width: 760px; height: auto;"></svg>
        <div id="graphSkeleton" class="flex items-center justify-center" style="position: absolute; inset: 0;">
          <div style="width: 130px; height: 130px; border-radius: 999px; border: 1.5px solid var(--hairlineHover); background: var(--panel); display: flex; align-items: center; justify-content: center;" class="skeleton-pulse">
            <span class="text-[10px] font-mono" style="color: var(--faint)">LOADING</span>
          </div>
        </div>
      </div>
      <span class="graph-scroll-hint" aria-hidden="true">&larr; scroll &rarr;</span>
    </div>

    <div id="gridToolbar" class="hidden items-center gap-2 mb-3">
      <span class="text-[10px] font-mono tracking-wide" style="color: var(--faint)">SORT</span>
      <div class="flex items-center border rounded-lg overflow-hidden font-mono text-xs hairline" role="group" aria-label="Sort by">
        <button type="button" class="view-toggle-btn active px-3 py-1.5" data-sort="priority" aria-pressed="true">Priority</button>
        <button type="button" class="view-toggle-btn px-3 py-1.5" data-sort="name" aria-pressed="false">Name</button>
        <button type="button" class="view-toggle-btn px-3 py-1.5" data-sort="updated" aria-pressed="false">Updated</button>
        <button type="button" class="view-toggle-btn px-3 py-1.5" data-sort="status" aria-pressed="false">Status</button>
      </div>
    </div>

    <div id="clusterGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <div class="mt-10 pt-6 border-t hairline">
      <h2 class="text-xs font-mono tracking-wide mb-3" style="color: var(--faint)">RECENT ACTIVITY, ACROSS ALL PROJECTS</h2>
      <div id="activityFeed" class="flex flex-col gap-1.5"></div>
    </div>
    </main>
  </div>

  <!-- Detail / Chat Modal -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-6">
    <div class="corner-notch rounded-xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden border hairline" style="background: var(--panel)" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="flex items-center justify-between px-6 py-4 border-b hairline">
        <div class="flex items-center gap-3">
          <div id="modalDot" class="w-3 h-3 rounded-full status-dot"></div>
          <h2 id="modalTitle" class="font-display font-700 text-lg"></h2>
        </div>
        <div class="flex items-center gap-3 flex-shrink-0">
          <button id="copyLinkBtn" type="button" class="text-[10px] font-mono px-2.5 py-1 rounded border hairline" style="color: var(--sub)" aria-live="polite">Copy link</button>
          <button id="closeModal" class="text-xl leading-none" style="color: var(--sub)">&times;</button>
        </div>
      </div>
      <div class="px-6 py-4 border-b hairline">
        <div class="flex items-center gap-2 mb-3 flex-wrap">
          <span id="modalStatusPill" class="tag-chip"></span>
          <span id="modalCategoryPill" class="tag-chip" style="background: rgba(255,255,255,0.05); color: var(--sub)"></span>
          <span id="modalPriorityPill" class="tag-chip hidden" style="background: rgba(255,255,255,0.05); color: var(--sub)">TOP PRIORITY</span>
          <span id="modalUpdated" class="text-xs font-mono ml-auto" style="color: var(--faint)"></span>
        </div>
        <p id="modalSummary" class="text-sm leading-relaxed" style="color: var(--sub)"></p>
        <div id="toggleRow" class="hidden mt-3 flex items-center gap-2">
          <label class="text-xs font-mono" style="color: var(--sub)">Automation:</label>
          <button id="toggleBtn" class="text-xs font-mono px-3 py-1 rounded border hairline"></button>
        </div>
        <a id="linkRow" class="hidden mt-3 text-xs font-mono px-3 py-1.5 rounded border hairline items-center gap-1.5 w-fit" style="color: var(--ink)">
          <span id="linkRowLabel"></span><span aria-hidden="true">&rarr;</span>
        </a>
        <div id="relatedRow" class="hidden mt-3 flex items-center gap-2 flex-wrap">
          <span class="text-xs font-mono" style="color: var(--sub)">Related:</span>
          <div id="relatedChips" class="flex items-center gap-2 flex-wrap"></div>
        </div>
      </div>
      <div id="chatMessages" class="flex-1 overflow-y-auto px-6 py-4 space-y-3 text-sm" role="log" aria-live="polite"></div>
      <div class="px-6 py-4 border-t hairline flex gap-2">
        <input id="chatInput" type="text" placeholder="Ask about this project..."
          class="flex-1 rounded-lg px-3 py-2 text-sm focus:outline-none border hairline"
          style="background: var(--panelLight); color: var(--ink)">
        <button id="sendChat" class="font-medium text-sm px-4 py-2 rounded-lg" style="background: var(--ink); color: var(--void)">Send</button>
      </div>
    </div>
  </div>

  <!-- Quick-jump palette (Ctrl/Cmd+K) -->
  <div id="paletteOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-start justify-center z-50 p-6" style="padding-top: 12vh;">
    <div class="corner-notch rounded-xl w-full max-w-lg max-h-[60vh] flex flex-col overflow-hidden border hairline" style="background: var(--panel)" role="dialog" aria-modal="true" aria-label="Jump to a project">
      <div class="flex items-center gap-2.5 px-4 py-3 border-b hairline">
        <span aria-hidden="true" style="color: var(--faint)">&#8981;</span>
        <input id="paletteInput" type="text" placeholder="Jump to a project..." aria-label="Jump to a project"
          class="flex-1 bg-transparent text-sm focus:outline-none" style="color: var(--ink)"
          role="combobox" aria-expanded="true" aria-controls="paletteResults" aria-autocomplete="list">
        <kbd class="kbd-chip text-[10px]" style="color: var(--sub)">ESC</kbd>
      </div>
      <div id="paletteResults" role="listbox" aria-label="Projects" class="flex-1 overflow-y-auto py-1.5"></div>
      <div id="paletteEmpty" class="hidden px-4 py-6 text-xs text-center" style="color: var(--faint)"></div>
    </div>
  </div>

<script>
let clusters = [];
let activeCluster = null;
let chatHistory = [];
// Bumped every time a modal opens, so an in-flight chat response for a
// project the user has since navigated away from (closed the modal, or
// opened a different project before the reply arrived) can tell it no
// longer applies and drop itself instead of appending into whatever
// project's chat window happens to be open when it resolves.
let chatSessionId = 0;
let currentView = 'graph';
let lastFocusedEl = null;

const CATEGORY_ORDER = ['Ventures & Business', 'Trading', 'Content', 'Reselling', 'School & Career', 'Health & Personal', 'Travel & Logistics', 'Personal & Infra', 'Uncategorized'];
const CATEGORY_COLOR = {
  'Ventures & Business': '#D9A441',
  'Trading': '#3DDC84',
  'Content': '#8B7FD9',
  'Reselling': '#D97B41',
  'School & Career': '#4F9FD9',
  'Health & Personal': '#DB5C82',
  'Travel & Logistics': '#41C9C2',
  'Personal & Infra': '#8A93A6',
  'Uncategorized': '#838992'
};

function categoryColor(cat) { return CATEGORY_COLOR[cat] || CATEGORY_COLOR['Uncategorized']; }

// Makes a click-to-open-modal element also operable from the keyboard,
// matching the graph nodes (which already had tabindex/role/Enter-Space).
function makeCardClickable(el) {
  el.setAttribute('tabindex', '0');
  el.setAttribute('role', 'button');
  el.addEventListener('click', () => openModal(el.dataset.id));
  el.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      openModal(el.dataset.id);
    }
  });
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function statusColor(status) {
  return {
    active: '#3DDC84', done: '#4A9EDB', stalled: '#E0A030',
    broken: '#E35959', unknown: '#838992'
  }[status] || '#838992';
}

function pillStyle(status) {
  const c = statusColor(status);
  return `background: ${c}1F; color: ${c};`;
}

let lastClustersRaw = null;
let lastFullRenderAt = 0;
let deepLinkChecked = false;

// True whenever the currently open modal added its own history entry (a
// normal card click), so closing it can hand control back to history.back()
// and let the URL/back-button stay in sync. False for a modal opened by
// restoring ?project= from the URL on load or via popstate, where the entry
// is already the current one and there is nothing of ours left to pop.
let modalHistoryPushed = false;

// loadClusters() fires from three unsynchronized places (initial load, the
// 30s interval, and the visibility-change refetch below), so a slower
// in-flight request can resolve after a newer one and repaint the page with
// stale data. Same monotonic-request-id guard as alpha/app.js's loadStatus(),
// for the same race.
let latestClustersRequestId = 0;

async function loadClusters() {
  const requestId = ++latestClustersRequestId;
  const errBox = document.getElementById('errorBanner');
  try {
    const res = await fetch('/api/clusters');
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const data = await res.json();
    if (requestId !== latestClustersRequestId) return;
    document.getElementById('graphSkeleton').classList.add('hidden');

    // A cluster file that fails to parse (a hand-edit typo) is skipped
    // server-side rather than taking the whole dashboard down with it, but
    // it should still say so, not just silently show one fewer project.
    if (data.brokenFiles && data.brokenFiles.length) {
      const names = data.brokenFiles.map(b => b.file).join(', ');
      errBox.textContent = `${data.brokenFiles.length} cluster file${data.brokenFiles.length === 1 ? '' : 's'} failed to load and ${data.brokenFiles.length === 1 ? 'was' : 'were'} skipped (invalid JSON): ${names}. Check the server log for details.`;
      errBox.classList.remove('hidden');
    } else {
      errBox.classList.add('hidden');
    }

    // Skip the re-render on unchanged data (the 30s poll refetches even
    // when nothing moved), since rebuilding the graph/grid DOM every time
    // would drop keyboard focus mid-tab and restart the pulse animations
    // on every active-status node. But every relative-time label on the
    // page (activity feed, LAST SYNC, graph node tooltips) is computed at
    // render time and frozen otherwise, so a dashboard left open with truly
    // unchanged data would keep saying "today" days later. Force a real
    // re-render at least every 5 minutes regardless, to bound how stale
    // those labels can get without giving up the skip's actual benefit.
    const raw = JSON.stringify(data.clusters);
    const dataUnchanged = raw === lastClustersRaw;
    const staleRenderTooLong = Date.now() - lastFullRenderAt > 5 * 60 * 1000;
    if (dataUnchanged && !staleRenderTooLong) return;
    lastClustersRaw = raw;
    lastFullRenderAt = Date.now();

    clusters = data.clusters.sort((a, b) => {
      const order = { top: 0, normal: 1, low: 2 };
      return (order[a.priority] ?? 1) - (order[b.priority] ?? 1);
    });
    renderStats();
    renderAttention();
    renderCategoryFilter();
    renderGraph();
    renderGrid();
    renderActivityFeed();

    // A project link (e.g. shared from the activity feed or a needs-attention
    // pill) only resolves once real cluster data is in, so this runs once
    // here rather than at page-load time, and only once, since loadClusters
    // itself re-fires every 30s on the polling interval.
    if (!deepLinkChecked) {
      deepLinkChecked = true;
      const pid = new URLSearchParams(location.search).get('project');
      if (pid && clusters.some(c => c.id === pid)) {
        openModal(pid, { isDeepLink: true });
      }
    }
  } catch (e) {
    if (requestId !== latestClustersRequestId) return;
    errBox.textContent = `Couldn't load project data: ${e.message}. Retrying in 30s.`;
    errBox.classList.remove('hidden');
  }
}

function renderActivityFeed() {
  const feed = document.getElementById('activityFeed');
  const dated = clusters.filter(c => c.lastUpdate).sort((a, b) => b.lastUpdate.localeCompare(a.lastUpdate));
  if (!dated.length) { feed.innerHTML = `<p class="text-xs" style="color: var(--faint)">Nothing dated yet.</p>`; return; }
  feed.innerHTML = dated.slice(0, 10).map(c => {
    const color = categoryColor(c.category);
    return `
      <div class="activity-row flex items-center gap-3 py-1.5 cursor-pointer" data-id="${escapeHtml(c.id)}">
        <span class="text-[10px] font-mono flex-shrink-0" style="color: var(--faint); width: 92px">${relativeTime(c.lastUpdate)}</span>
        <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" style="background: ${color}"></span>
        <span class="text-xs font-medium flex-shrink-0" style="color: var(--ink)">${escapeHtml(c.name)}</span>
        <span class="text-xs truncate" style="color: var(--sub)">${escapeHtml(c.summary)}</span>
      </div>
    `;
  }).join('');
  feed.querySelectorAll('[data-id]').forEach(makeCardClickable);
}

function renderStats() {
  const active = clusters.filter(c => c.status === 'active').length;
  const attention = clusters.filter(c => c.status === 'stalled' || c.status === 'broken').length;
  const dated = clusters.filter(c => c.lastUpdate).map(c => c.lastUpdate).sort().reverse();
  const lastSync = dated[0] || 'n/a';
  document.getElementById('statsRow').innerHTML = `
    <div><div class="font-display font-700 text-lg leading-none">${clusters.length}</div><div class="text-[10px] font-mono mt-1 tracking-wide" style="color:var(--faint)">PROJECTS</div></div>
    <div><div class="font-display font-700 text-lg leading-none" style="color:${statusColor('active')}">${active}</div><div class="text-[10px] font-mono mt-1 tracking-wide" style="color:var(--faint)">ACTIVE</div></div>
    <div><div class="font-display font-700 text-lg leading-none" style="color:${attention ? statusColor('broken') : 'var(--faint)'}">${attention}</div><div class="text-[10px] font-mono mt-1 tracking-wide" style="color:var(--faint)">NEEDS ATTN</div></div>
    <div><div class="font-display font-700 text-lg leading-none" style="color:var(--sub)">${escapeHtml(lastSync)}</div><div class="text-[10px] font-mono mt-1 tracking-wide" style="color:var(--faint)">LAST SYNC</div></div>
  `;
}

function renderAttention() {
  const flagged = clusters.filter(c => c.status === 'stalled' || c.status === 'broken');
  const compact = document.getElementById('attnCompact');
  const cards = document.getElementById('attnCards');

  if (!flagged.length) {
    compact.classList.add('hidden'); compact.classList.remove('flex'); compact.innerHTML = '';
    cards.classList.add('hidden'); cards.classList.remove('flex'); cards.innerHTML = '';
    return;
  }

  compact.innerHTML = `
    <span class="text-[10px] font-mono tracking-wide mr-1" style="color:var(--faint)">NEEDS ATTENTION</span>
    ${flagged.map(c => `
      <button class="attn-pill" data-id="${escapeHtml(c.id)}" style="border-color:${statusColor(c.status)}66; color:${statusColor(c.status)}">
        <span class="w-1.5 h-1.5 rounded-full inline-block mr-1.5" style="background:${statusColor(c.status)}"></span>${escapeHtml(c.name)}
      </button>
    `).join('')}
  `;
  cards.innerHTML = flagged.map(c => `
    <div class="attn-card flex items-center gap-3 rounded-lg px-4 py-3 border" data-id="${escapeHtml(c.id)}" style="border-color:${statusColor(c.status)}40; background: rgba(255,255,255,0.02)">
      <div class="w-2 h-2 rounded-full flex-shrink-0 status-dot" style="background:${statusColor(c.status)}; color:${statusColor(c.status)}"></div>
      <div class="min-w-0 flex-1">
        <div class="font-display font-700 text-sm" style="color: var(--ink)">${escapeHtml(c.name)}</div>
        <div class="text-xs truncate" style="color: var(--sub)">${escapeHtml(c.summary)}</div>
      </div>
      <span class="tag-chip flex-shrink-0" style="${pillStyle(c.status)}">${escapeHtml(c.status)}</span>
    </div>
  `).join('');

  compact.querySelectorAll('.attn-pill').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.id));
  });
  cards.querySelectorAll('.attn-card').forEach(makeCardClickable);

  updateAttentionVisibility();
}

function updateAttentionVisibility() {
  const flagged = clusters.some(c => c.status === 'stalled' || c.status === 'broken');
  const compact = document.getElementById('attnCompact');
  const cards = document.getElementById('attnCards');
  if (!flagged) return;
  compact.classList.toggle('hidden', currentView !== 'graph');
  compact.classList.toggle('flex', currentView === 'graph');
  cards.classList.toggle('hidden', currentView !== 'grid');
  cards.classList.toggle('flex', currentView === 'grid');
}

function truncateLabel(name, max = 16) {
  return name.length > max ? name.slice(0, max - 1) + '…' : name;
}

const LABEL_STOPWORDS = new Set(['the', 'a', 'an']);

// Picks the word that actually distinguishes a project on the graph, so
// e.g. "The Garage" and "The Mechanic" don't both render as just "The".
function nodeLabelWord(name) {
  const words = name.split(' ');
  if (LABEL_STOPWORDS.has(words[0].toLowerCase()) && words[1]) {
    return words[1];
  }
  return words[0];
}

function groupByCategory(list) {
  const map = {};
  list.forEach(c => {
    const cat = c.category || 'Uncategorized';
    (map[cat] = map[cat] || []).push(c);
  });
  const keys = [
    ...CATEGORY_ORDER.filter(k => map[k]),
    ...Object.keys(map).filter(k => !CATEGORY_ORDER.includes(k))
  ];
  return keys.map(k => ({ category: k, items: map[k] }));
}

function priorityOrbit(priority) {
  return priority === 'top' ? 235 : priority === 'low' ? 345 : 295;
}

function nodeRadius(priority) {
  return priority === 'top' ? 34 : priority === 'low' ? 22 : 28;
}

function renderGraph() {
  const svg = d3.select('#graphSvg');
  const cx = 450, cy = 450, hubR = 65;
  const groups = groupByCategory(clusters);
  const totalWeight = groups.reduce((s, g) => s + g.items.length, 0) || 1;

  // Compute each node's *target* position (sector angle + priority-based radius),
  // then let a short-lived D3 force simulation nudge nodes apart so none overlap,
  // while staying pulled toward that target. This is the actual fix for nodes
  // crowding into each other at 20+ projects instead of hand-tuned angle math.
  const simNodes = [];
  let angleCursor = -Math.PI / 2;
  const sectorMeta = [];

  groups.forEach(g => {
    const span = (2 * Math.PI) * (g.items.length / totalWeight);
    const wedgeStart = angleCursor;
    const wedgeEnd = angleCursor + span;
    sectorMeta.push({ category: g.category, wedgeStart, wedgeEnd, mid: (wedgeStart + wedgeEnd) / 2 });

    const innerStart = g.items.length > 1 ? wedgeStart + span * 0.16 : sectorMeta[sectorMeta.length - 1].mid;
    const innerEnd = g.items.length > 1 ? wedgeEnd - span * 0.16 : innerStart;
    const step = g.items.length > 1 ? (innerEnd - innerStart) / (g.items.length - 1) : 0;

    g.items.forEach((c, idx) => {
      const angle = g.items.length > 1 ? innerStart + idx * step : sectorMeta[sectorMeta.length - 1].mid;
      const r = priorityOrbit(c.priority);
      simNodes.push({
        ...c,
        targetX: cx + r * Math.cos(angle),
        targetY: cy + r * Math.sin(angle),
        radius: nodeRadius(c.priority)
      });
    });
    angleCursor = wedgeEnd;
  });

  const sim = d3.forceSimulation(simNodes)
    .force('x', d3.forceX(d => d.targetX).strength(0.35))
    .force('y', d3.forceY(d => d.targetY).strength(0.35))
    .force('collide', d3.forceCollide(d => d.radius + 22).strength(1))
    .stop();
  for (let i = 0; i < 220; i++) sim.tick();

  let sectorHtml = '', spokesHtml = '', nodesHtml = '';

  sectorMeta.forEach(s => {
    const divX = cx + 420 * Math.cos(s.wedgeStart);
    const divY = cy + 420 * Math.sin(s.wedgeStart);
    const divHx = cx + hubR * Math.cos(s.wedgeStart);
    const divHy = cy + hubR * Math.sin(s.wedgeStart);
    sectorHtml += `<line x1="${divHx.toFixed(1)}" y1="${divHy.toFixed(1)}" x2="${divX.toFixed(1)}" y2="${divY.toFixed(1)}" stroke="var(--hairline)" stroke-width="1" stroke-dasharray="3,5" />`;
    const labX = cx + 400 * Math.cos(s.mid);
    const labY = cy + 400 * Math.sin(s.mid);
    sectorHtml += `<text class="cat-label" data-category="${escapeHtml(s.category)}" x="${labX.toFixed(1)}" y="${labY.toFixed(1)}" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="var(--faint)" letter-spacing="1" opacity="0.85">${escapeHtml(s.category.toUpperCase())}</text>`;
  });

  let relationsHtml = '';
  const seenPairs = new Set();

  simNodes.forEach(c => {
    const nx = c.x, ny = c.y;
    const hx = cx + hubR * ((nx - cx) / Math.hypot(nx - cx, ny - cy) || 0);
    const hy = cy + hubR * ((ny - cy) / Math.hypot(nx - cx, ny - cy) || 0);
    const color = categoryColor(c.category);
    spokesHtml += `<line class="spoke-line" x1="${hx.toFixed(1)}" y1="${hy.toFixed(1)}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${color}" stroke-opacity="0.3" stroke-width="1.5" />`;

    // Real cross-project relationships only (e.g. Lifting Tracker relays into
    // Macro Tracker), not decorative, only drawn when a cluster's own data
    // actually declares a relatedTo link.
    (c.relatedTo || []).forEach(otherId => {
      const pairKey = [c.id, otherId].sort().join('|');
      if (seenPairs.has(pairKey)) return;
      seenPairs.add(pairKey);
      const other = simNodes.find(n => n.id === otherId);
      if (!other) return;
      const midX = (nx + other.x) / 2 + (ny - other.y) * 0.12;
      const midY = (ny + other.y) / 2 + (other.x - nx) * 0.12;
      relationsHtml += `<path d="M${nx.toFixed(1)},${ny.toFixed(1)} Q${midX.toFixed(1)},${midY.toFixed(1)} ${other.x.toFixed(1)},${other.y.toFixed(1)}" fill="none" stroke="var(--sub)" stroke-width="1" stroke-dasharray="1,4" opacity="0.5" />`;
    });

    const r = c.radius;
    const sColor = statusColor(c.status);
    const dx = nx + (r + 3) * 0.7;
    const dy = ny - (r + 3) * 0.7;
    const stale = c.lastUpdate && (Date.now() - new Date(c.lastUpdate + 'T00:00:00')) / 86400000 > 30;
    // A JS-added role="button" on a grouped SVG element can't reliably rely
    // on a nested <title> for its accessible name across every browser and
    // screen reader pairing, so this is stated explicitly rather than only
    // implied by <title>, which stays for the native mouse-hover tooltip.
    const nodeLabel = `${c.name}, ${c.status}, updated ${relativeTime(c.lastUpdate)}${stale ? ' (stale, over a month untouched)' : ''}`;

    nodesHtml += `
      <g class="graph-node" data-id="${escapeHtml(c.id)}" aria-label="${escapeHtml(nodeLabel)}">
        <title>${escapeHtml(nodeLabel)}</title>
        <circle class="node-glow${c.status === 'active' ? ' node-glow-active' : ''}" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="${r + 6}" fill="${color}" opacity="0.16" />
        <circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="${r}" fill="${color}20" stroke="${color}" stroke-width="1.5" ${stale ? 'stroke-dasharray="4,3"' : ''} />
        <circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="4.5" fill="${sColor}" stroke="var(--void)" stroke-width="1.5" opacity="${stale ? 0.45 : 1}" />
        ${c.priority === 'top' ? `<circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="${r + 5}" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2,3" opacity="0.7" />` : ''}
        <text x="${nx.toFixed(1)}" y="${(ny + 3.5).toFixed(1)}" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="${r > 30 ? 9 : 8}" fill="var(--ink)" font-weight="500">${escapeHtml(truncateLabel(nodeLabelWord(c.name), 9))}</text>
      </g>
    `;
  });

  const hubHtml = `
    <circle cx="${cx}" cy="${cy}" r="${hubR}" fill="var(--panel)" stroke="var(--hairlineHover)" stroke-width="1.5" class="hub-node" />
    <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="13" fill="var(--ink)" letter-spacing="0.5">COMMAND</text>
    <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="13" fill="var(--ink)" letter-spacing="0.5">CENTER</text>
  `;

  svg.html(sectorHtml + spokesHtml + relationsHtml + hubHtml + nodesHtml);
  svg.selectAll('.graph-node')
    .attr('tabindex', 0)
    .attr('role', 'button')
    .on('click', function() {
      openModal(this.getAttribute('data-id'));
    })
    .on('keydown', function(event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openModal(this.getAttribute('data-id'));
      }
    });
  svg.selectAll('.cat-label')
    .attr('tabindex', 0)
    .attr('role', 'button')
    .on('click', function() { toggleCategoryFilter(this); })
    .on('keydown', function(event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleCategoryFilter(this);
      }
    });
  applyFilters();
  centerGraphScroll();
}

// Below 768px the graph renders at a fixed, legible pixel size wider than
// the screen (see the matching media query) and scrolls horizontally, so
// start that scroll centered on the hub instead of showing its left edge.
function centerGraphScroll() {
  if (window.innerWidth > 767) return;
  const scroller = document.getElementById('graphScroll');
  requestAnimationFrame(() => {
    scroller.scrollLeft = (scroller.scrollWidth - scroller.clientWidth) / 2;
  });
}

let searchTerm = '';
let activeCategory = null;

// Shared by the graph's sector labels and the standalone category filter
// row, so clicking a category filters the whole board no matter which view
// you're in.
function toggleCategoryFilter(el) {
  const cat = el.getAttribute('data-category');
  activeCategory = activeCategory === cat ? null : cat;
  applyFilters();
  renderCategoryFilter();
}

// A view-independent category filter bar, since the graph's own clickable
// sector labels have no equivalent in Grid view, so Grid had no way to
// filter by category at all.
function renderCategoryFilter() {
  const row = document.getElementById('categoryFilterRow');
  const categories = groupByCategory(clusters).map(g => g.category);
  row.innerHTML = categories.map(cat => {
    const color = categoryColor(cat);
    const active = activeCategory === cat;
    return `<button type="button" class="tag-chip cat-filter-chip" data-category="${escapeHtml(cat)}" aria-pressed="${active}" style="background:${color}1F; color:${color}; ${active ? `outline: 1.5px solid ${color};` : ''}">${escapeHtml(cat.toUpperCase())}</button>`;
  }).join('');
  row.querySelectorAll('.cat-filter-chip').forEach(el => {
    el.addEventListener('click', () => toggleCategoryFilter(el));
  });
}

function applyFilters() {
  const term = searchTerm.trim().toLowerCase();
  const anyFilterActive = !!term || !!activeCategory;
  let matchCount = 0;
  // Only count against one element type (graph-node) even though both graph
  // and grid nodes get the dimmed/matched classes below, so the announced
  // count reflects distinct projects, not double the real total.
  const countedIds = new Set();
  document.querySelectorAll('.graph-node, .cluster-card').forEach(el => {
    const id = el.dataset.id;
    const c = clusters.find(x => x.id === id);
    if (!c) return;
    const matchesSearch = !term || c.name.toLowerCase().includes(term) || (c.category || '').toLowerCase().includes(term) || (c.summary || '').toLowerCase().includes(term) || (c.status || '').toLowerCase().includes(term);
    const matchesCategory = !activeCategory || c.category === activeCategory;
    const matches = matchesSearch && matchesCategory;
    const isDimmed = anyFilterActive && !matches;
    el.classList.toggle('dimmed', isDimmed);
    el.classList.toggle('matched', anyFilterActive && matches);
    // Faded to 16% opacity, a dimmed card/node fails WCAG contrast for
    // sighted users and, worse, reads to a screen reader exactly like a
    // real match since aria-hidden/tabindex aren't affected by opacity.
    // Pull it out of both the accessibility tree and tab order instead of
    // just fading it, so it's excluded the same way for every user, not
    // just visually.
    el.setAttribute('aria-hidden', String(isDimmed));
    el.setAttribute('tabindex', isDimmed ? '-1' : '0');
    if (matches && !countedIds.has(id)) {
      countedIds.add(id);
      matchCount++;
    }
  });
  document.querySelectorAll('.cat-label').forEach(el => {
    const isActive = activeCategory === el.getAttribute('data-category');
    el.setAttribute('aria-pressed', String(isActive));
    el.setAttribute('fill', isActive ? 'var(--ink)' : 'var(--faint)');
    el.setAttribute('opacity', !activeCategory || isActive ? '1' : '0.4');
  });
  document.getElementById('searchClearBtn').classList.toggle('hidden', !term);
  // Hidden once there's a term to clear instead (the clear button takes over
  // that same corner), and while the box is focused, same as GitHub's own
  // "/" search hint, since anyone looking at a focused, empty box already
  // found it.
  document.getElementById('searchKbdHint').classList.toggle('hidden', !!term || document.activeElement === document.getElementById('searchInput'));
  document.getElementById('filterStatus').textContent = anyFilterActive
    ? `${matchCount} project${matchCount === 1 ? '' : 's'} match${matchCount === 1 ? 'es' : ''}${activeCategory ? ` in ${activeCategory}` : ''}${term ? ` for "${term}"` : ''}`
    : '';

  // A dimmed-to-16%-opacity board with zero full-opacity cards reads as
  // "broken" rather than "no results" to a sighted user, since nothing on
  // screen actually says so (only the sr-only filterStatus above does).
  const noResults = document.getElementById('noResultsMsg');
  const showNoResults = anyFilterActive && matchCount === 0;
  noResults.classList.toggle('hidden', !showNoResults);
  noResults.classList.toggle('flex', showNoResults);
  if (showNoResults) {
    document.getElementById('noResultsText').textContent =
      `No projects match${activeCategory ? ` in ${activeCategory}` : ''}${term ? ` for "${term}"` : ''}.`;
  }
}

function clearAllFilters() {
  searchTerm = '';
  activeCategory = null;
  document.getElementById('searchInput').value = '';
  applyFilters();
  renderCategoryFilter();
}
document.getElementById('clearFiltersBtn').addEventListener('click', clearAllFilters);

const searchInputEl = document.getElementById('searchInput');
searchInputEl.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  applyFilters();
});
searchInputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && searchInputEl.value) {
    e.stopPropagation();
    searchInputEl.value = '';
    searchTerm = '';
    applyFilters();
  }
});
// The "/" hint's focused/unfocused half of its visibility rule (the has-a-
// term half is already covered by applyFilters on every keystroke) has
// nothing else to trigger a re-render on, so it needs its own listeners.
searchInputEl.addEventListener('focus', applyFilters);
searchInputEl.addEventListener('blur', applyFilters);
document.getElementById('searchClearBtn').addEventListener('click', () => {
  searchInputEl.value = '';
  searchTerm = '';
  applyFilters();
  searchInputEl.focus();
});

function relativeTime(dateStr) {
  if (!dateStr) return 'no date on record';
  const days = Math.floor((Date.now() - new Date(dateStr + 'T00:00:00')) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return '1 day ago';
  if (days < 30) return `${days} days ago`;
  const months = Math.floor(days / 30);
  return months === 1 ? '1 month ago' : `${months} months ago`;
}

let gridSortBy = 'priority';
try { gridSortBy = localStorage.getItem('ccGridSort') || 'priority'; } catch {}
document.querySelectorAll('#gridToolbar [data-sort]').forEach(btn => {
  btn.classList.toggle('active', btn.dataset.sort === gridSortBy);
  btn.setAttribute('aria-pressed', String(btn.dataset.sort === gridSortBy));
});

const STATUS_SEVERITY = { broken: 0, stalled: 1, active: 2, unknown: 3, done: 4 };

// Grid's own sort, independent of the `clusters` array order the graph relies
// on for its priority-orbit and category-sector angles, so re-sorting the
// grid never nudges graph node positions.
function sortForGrid(list) {
  const sorted = list.slice();
  if (gridSortBy === 'name') {
    sorted.sort((a, b) => a.name.localeCompare(b.name));
  } else if (gridSortBy === 'updated') {
    sorted.sort((a, b) => (b.lastUpdate || '').localeCompare(a.lastUpdate || ''));
  } else if (gridSortBy === 'status') {
    sorted.sort((a, b) => (STATUS_SEVERITY[a.status] ?? 3) - (STATUS_SEVERITY[b.status] ?? 3));
  }
  // 'priority' needs no re-sort, `clusters` is already priority-ordered.
  return sorted;
}

function setGridSort(sortBy) {
  gridSortBy = sortBy;
  try { localStorage.setItem('ccGridSort', sortBy); } catch {}
  document.querySelectorAll('#gridToolbar [data-sort]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.sort === sortBy);
    btn.setAttribute('aria-pressed', String(btn.dataset.sort === sortBy));
  });
  renderGrid();
}
document.querySelectorAll('#gridToolbar [data-sort]').forEach(btn => {
  btn.addEventListener('click', () => setGridSort(btn.dataset.sort));
});

function renderGrid() {
  const grid = document.getElementById('clusterGrid');
  grid.innerHTML = sortForGrid(clusters).map(c => {
    const color = categoryColor(c.category);
    return `
    <div class="cluster-card cursor-pointer rounded-xl p-5 border hairline" style="background: var(--panel)" data-id="${escapeHtml(c.id)}">
      <div class="flex items-center justify-between mb-3">
        <span class="tag-chip" style="background:${color}1F; color:${color}">${escapeHtml((c.category || 'Uncategorized').toUpperCase())}</span>
        <div class="w-2.5 h-2.5 rounded-full status-dot" style="background: ${statusColor(c.status)}; color: ${statusColor(c.status)}"></div>
      </div>
      <h2 class="font-display font-700 text-base mb-1" style="color: var(--ink)">${escapeHtml(c.name)}${c.priority === 'top' ? ' <span style=\'font-size:9px;color:var(--faint);font-family:monospace;letter-spacing:0.5px;vertical-align:middle\'>&nbsp;TOP</span>' : ''}</h2>
      <p class="text-xs leading-snug line-clamp-3" style="color: var(--sub)">${escapeHtml(c.summary)}</p>
      <div class="mt-3 flex items-center justify-between">
        <span class="tag-chip" style="${pillStyle(c.status)}">${escapeHtml(c.status)}</span>
        ${c.toggleable ? `<span class="text-[10px] font-mono" style="color: ${c.enabled ? '#3DDC84' : 'var(--faint)'}">${c.enabled ? 'ON' : 'OFF'}</span>` : ''}
      </div>
    </div>
  `;
  }).join('');

  document.querySelectorAll('.cluster-card').forEach(makeCardClickable);
  // Re-applies the live search/category filter to the freshly rendered cards.
  // Without this, a poll re-render (renderGraph, then renderGrid) leaves the
  // new grid cards unfiltered until the next keystroke, since renderGraph's
  // own end-of-render applyFilters() call only touched the cards that
  // existed before this innerHTML rebuild replaced them.
  applyFilters();
}

function setView(view, persist = true) {
  currentView = view;
  document.getElementById('graphView').classList.toggle('hidden', view !== 'graph');
  document.getElementById('clusterGrid').classList.toggle('hidden', view !== 'grid');
  document.getElementById('gridToolbar').classList.toggle('hidden', view !== 'grid');
  document.getElementById('gridToolbar').classList.toggle('flex', view === 'grid');
  document.getElementById('viewGraphBtn').classList.toggle('active', view === 'graph');
  document.getElementById('viewGridBtn').classList.toggle('active', view === 'grid');
  document.getElementById('viewGraphBtn').setAttribute('aria-pressed', String(view === 'graph'));
  document.getElementById('viewGridBtn').setAttribute('aria-pressed', String(view === 'grid'));
  updateAttentionVisibility();
  if (persist) {
    try { localStorage.setItem('ccView', view); } catch {}
  }
}
document.getElementById('viewGraphBtn').addEventListener('click', () => setView('graph'));
document.getElementById('viewGridBtn').addEventListener('click', () => setView('grid'));

// Prints a project status report regardless of which view (Graph or Grid) is
// currently active: the graph's circular node layout has no meaningful
// printed form, so the print stylesheet below always renders the grid's
// cards plus the needs-attention list and activity feed instead, same
// "force the printable layout, ignore the current on-screen view" pattern
// as CSM/Garage/CGT/Sondrik's own print buttons.
document.getElementById('printBtn').addEventListener('click', () => window.print());

// Remember Graph vs Grid across reloads, same as a browser remembering a
// list/gallery toggle, so switching to Grid does not silently reset itself
// on every visit.
try {
  if (localStorage.getItem('ccView') === 'grid') setView('grid', false);
} catch {}

// Locks background scroll behind the modal overlay. Reserves the width the
// scrollbar was taking up as body padding first, so hiding it doesn't shift
// the header/graph sideways by a few pixels while the modal is open.
function lockBodyScroll() {
  const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
  if (scrollbarWidth > 0) document.body.style.paddingRight = `${scrollbarWidth}px`;
  document.body.style.overflow = 'hidden';
}
function unlockBodyScroll() {
  document.body.style.overflow = '';
  document.body.style.paddingRight = '';
}

// Mirrors the currently open project into ?project=<id>, same convention as
// the CSM/Garage/CGT hubs mirroring their own filters into the URL, so a
// specific project's modal can be bookmarked or shared as a direct link.
// A real click pushes a new history entry (so the back button closes the
// modal, standard modal-deep-link behavior); restoring from a URL that
// already names the project (initial load, or popstate) does not.
function openModal(id, opts = {}) {
  const { isDeepLink = false } = opts;
  activeCluster = clusters.find(c => c.id === id);
  lastFocusedEl = document.activeElement;
  chatHistory = [];
  chatSessionId++;
  // A pending chat request from whatever project was open before could
  // still be in flight and would otherwise re-disable these once it settles;
  // this fresh modal's own input should never start out stuck disabled
  // because of a conversation that isn't even showing anymore.
  document.getElementById('chatInput').disabled = false;
  document.getElementById('sendChat').disabled = false;
  removeTypingIndicator();
  const color = categoryColor(activeCluster.category);
  document.getElementById('modalDot').style.background = statusColor(activeCluster.status);
  document.getElementById('modalDot').style.color = statusColor(activeCluster.status);
  document.getElementById('modalTitle').textContent = activeCluster.name;
  document.getElementById('modalTitle').style.color = color;
  document.getElementById('modalStatusPill').textContent = activeCluster.status;
  document.getElementById('modalStatusPill').className = 'tag-chip';
  document.getElementById('modalStatusPill').setAttribute('style', pillStyle(activeCluster.status));
  document.getElementById('modalCategoryPill').textContent = (activeCluster.category || 'Uncategorized').toUpperCase();
  document.getElementById('modalCategoryPill').setAttribute('style', `background:${color}1F; color:${color}`);
  document.getElementById('modalPriorityPill').classList.toggle('hidden', activeCluster.priority !== 'top');
  document.getElementById('modalUpdated').textContent = activeCluster.lastUpdate ? `${activeCluster.lastUpdate} (${relativeTime(activeCluster.lastUpdate)})` : 'no date on record';
  document.getElementById('modalSummary').textContent = activeCluster.summary;
  document.getElementById('chatMessages').innerHTML = '';

  const toggleRow = document.getElementById('toggleRow');
  if (activeCluster.toggleable) {
    toggleRow.classList.remove('hidden');
    toggleRow.classList.add('flex');
    updateToggleBtn();
  } else {
    toggleRow.classList.add('hidden');
    toggleRow.classList.remove('flex');
  }

  const linkRow = document.getElementById('linkRow');
  if (activeCluster.link) {
    linkRow.href = activeCluster.link;
    document.getElementById('linkRowLabel').textContent = activeCluster.linkLabel || 'Open';
    linkRow.classList.remove('hidden');
    linkRow.classList.add('flex');
  } else {
    linkRow.classList.add('hidden');
    linkRow.classList.remove('flex');
  }

  // relatedTo only ever renders as the graph's dashed connector line, which
  // is invisible in Grid view (the persisted default for anyone who has ever
  // switched to it), so a real, validated relationship could otherwise never
  // surface at all for that user. Surfaces it here too, as clickable chips
  // that jump straight to the related project's own modal.
  const relatedRow = document.getElementById('relatedRow');
  const relatedIds = activeCluster.relatedTo || [];
  const relatedClusters = relatedIds.map(id => clusters.find(c => c.id === id)).filter(Boolean);
  if (relatedClusters.length) {
    document.getElementById('relatedChips').innerHTML = relatedClusters.map(c => `
      <button type="button" class="tag-chip" data-related-id="${escapeHtml(c.id)}" style="background:${categoryColor(c.category)}1F; color:${categoryColor(c.category)}; cursor: pointer; border: none;">${escapeHtml(c.name)}</button>
    `).join('');
    document.querySelectorAll('#relatedChips [data-related-id]').forEach(el => {
      el.addEventListener('click', () => openModal(el.dataset.relatedId));
    });
    relatedRow.classList.remove('hidden');
    relatedRow.classList.add('flex');
  } else {
    relatedRow.classList.add('hidden');
    relatedRow.classList.remove('flex');
  }

  document.getElementById('modalOverlay').classList.remove('hidden');
  document.getElementById('modalOverlay').classList.add('flex');
  lockBodyScroll();
  document.getElementById('closeModal').focus();

  if (isDeepLink) {
    modalHistoryPushed = false;
  } else {
    const url = `${location.pathname}?project=${encodeURIComponent(id)}`;
    history.pushState({ ccProject: id }, '', url);
    modalHistoryPushed = true;
  }
}

function getModalFocusable() {
  return Array.from(document.getElementById('modalOverlay').querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  )).filter(el => !el.hasAttribute('disabled') && el.offsetParent !== null);
}

function closeModalAndReturnFocus(opts = {}) {
  const { fromPopState = false } = opts;
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalOverlay').classList.remove('flex');
  unlockBodyScroll();
  if (lastFocusedEl && typeof lastFocusedEl.focus === 'function') {
    lastFocusedEl.focus();
  }
  lastFocusedEl = null;

  // Closing already came from the back button (fromPopState), so the URL is
  // already correct, don't touch history again. Otherwise, an X/Escape/
  // overlay-click close should behave like pressing back if opening this
  // modal is what pushed the history entry now on top, and just strip the
  // query string in place if it didn't (a modal restored from a shared link).
  if (!fromPopState) {
    if (modalHistoryPushed) {
      history.back();
    } else if (new URLSearchParams(location.search).has('project')) {
      history.replaceState(null, '', location.pathname);
    }
  }
  modalHistoryPushed = false;
}

window.addEventListener('popstate', () => {
  const pid = new URLSearchParams(location.search).get('project');
  const modalOpen = !document.getElementById('modalOverlay').classList.contains('hidden');
  if (pid) {
    if (!modalOpen || !activeCluster || activeCluster.id !== pid) {
      if (clusters.some(c => c.id === pid)) openModal(pid, { isDeepLink: true });
    }
  } else if (modalOpen) {
    closeModalAndReturnFocus({ fromPopState: true });
  }
});

// Quick-jump palette: a real project's name is often much faster to type
// than hunting it down by eye in a 20+-node graph or scrolling a grid, same
// reason Linear/Vercel/GitHub all ship a Cmd+K jump-to. Deliberately kept to
// jumping into a project's own modal (identical destination to clicking its
// card), not a general command runner, since that is the one real repeated
// need here.
let paletteOpen = false;
let paletteSelectedIndex = 0;
let paletteResultsCache = [];
let paletteLastFocusedEl = null;

// Plain substring scoring, not character-subsequence fuzzy matching: with
// ~20 real projects a name/category/summary substring already finds the
// right one reliably, and a looser fuzzy matcher risks more surprising
// mismatches than it saves keystrokes at this list size.
function paletteScore(c, term) {
  const name = c.name.toLowerCase();
  if (name.startsWith(term)) return 0;
  if (name.includes(term)) return 1;
  if ((c.category || '').toLowerCase().includes(term)) return 2;
  if ((c.summary || '').toLowerCase().includes(term)) return 3;
  return -1;
}

function paletteFilteredResults() {
  const term = document.getElementById('paletteInput').value.trim().toLowerCase();
  if (!term) return clusters.slice();
  return clusters
    .map(c => ({ c, score: paletteScore(c, term) }))
    .filter(x => x.score >= 0)
    .sort((a, b) => a.score - b.score || a.c.name.localeCompare(b.c.name))
    .map(x => x.c);
}

function renderPaletteResults() {
  paletteResultsCache = paletteFilteredResults();
  const list = document.getElementById('paletteResults');
  const empty = document.getElementById('paletteEmpty');

  if (!paletteResultsCache.length) {
    list.innerHTML = '';
    empty.textContent = clusters.length ? 'No projects match.' : 'Projects still loading...';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  paletteSelectedIndex = Math.max(0, Math.min(paletteSelectedIndex, paletteResultsCache.length - 1));

  list.innerHTML = paletteResultsCache.map((c, i) => `
    <div class="palette-item" role="option" id="palette-opt-${i}" data-id="${escapeHtml(c.id)}" aria-selected="${i === paletteSelectedIndex}">
      <span class="w-2 h-2 rounded-full flex-shrink-0" style="background:${categoryColor(c.category)}"></span>
      <span class="palette-item-name">${escapeHtml(c.name)}</span>
      <span class="palette-item-cat">${escapeHtml((c.category || 'Uncategorized').toUpperCase())}</span>
      <span class="palette-item-status" style="${pillStyle(c.status)}">${escapeHtml(c.status)}</span>
    </div>
  `).join('');
  document.getElementById('paletteInput').setAttribute('aria-activedescendant', `palette-opt-${paletteSelectedIndex}`);
  list.querySelectorAll('.palette-item').forEach(el => {
    el.addEventListener('click', () => activatePaletteItem(el.dataset.id));
    el.addEventListener('mouseenter', () => {
      paletteSelectedIndex = Number(el.id.replace('palette-opt-', ''));
      renderPaletteResults();
    });
  });
  const selectedEl = document.getElementById(`palette-opt-${paletteSelectedIndex}`);
  if (selectedEl) selectedEl.scrollIntoView({ block: 'nearest' });
}

function paletteMove(delta) {
  if (!paletteResultsCache.length) return;
  paletteSelectedIndex = (paletteSelectedIndex + delta + paletteResultsCache.length) % paletteResultsCache.length;
  renderPaletteResults();
}

function activatePaletteItem(id) {
  closePalette();
  openModal(id);
}

function openPalette() {
  if (paletteOpen) return;
  paletteOpen = true;
  paletteSelectedIndex = 0;
  paletteLastFocusedEl = document.activeElement;
  document.getElementById('paletteInput').value = '';
  document.getElementById('paletteOverlay').classList.remove('hidden');
  document.getElementById('paletteOverlay').classList.add('flex');
  lockBodyScroll();
  renderPaletteResults();
  document.getElementById('paletteInput').focus();
}

function closePalette() {
  if (!paletteOpen) return;
  paletteOpen = false;
  document.getElementById('paletteOverlay').classList.add('hidden');
  document.getElementById('paletteOverlay').classList.remove('flex');
  unlockBodyScroll();
  if (paletteLastFocusedEl && typeof paletteLastFocusedEl.focus === 'function') paletteLastFocusedEl.focus();
  paletteLastFocusedEl = null;
}

document.getElementById('paletteInput').addEventListener('input', () => {
  paletteSelectedIndex = 0;
  renderPaletteResults();
});
document.getElementById('paletteOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('paletteOverlay')) closePalette();
});
document.getElementById('paletteBtn').addEventListener('click', openPalette);

// Same "copy the shareable URL" affordance as the CSM/Garage/CGT hubs, here
// copying a direct link to the open project's modal rather than a filtered
// view.
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
  } finally {
    document.body.removeChild(ta);
  }
  return Promise.resolve();
}

const copyLinkBtn = document.getElementById('copyLinkBtn');
const COPY_LINK_LABEL = copyLinkBtn.textContent;
copyLinkBtn.addEventListener('click', () => {
  copyText(location.href)
    .then(() => { copyLinkBtn.textContent = 'Link copied'; })
    .catch(() => { copyLinkBtn.textContent = "Couldn't copy, link is in the address bar"; })
    .finally(() => {
      setTimeout(() => { copyLinkBtn.textContent = COPY_LINK_LABEL; }, 1800);
    });
});

function updateToggleBtn() {
  const btn = document.getElementById('toggleBtn');
  btn.textContent = activeCluster.enabled ? 'ON, click to disable' : 'OFF, click to enable';
  btn.style.color = activeCluster.enabled ? '#3DDC84' : 'var(--sub)';
}

document.getElementById('toggleBtn').addEventListener('click', async () => {
  // Captured by reference, not just id, so this keeps pointing at the
  // project that was actually toggled even if the user closes this modal
  // and opens a different one before the request resolves. Without this,
  // the response would land on whatever `activeCluster` refers to *then*,
  // silently flipping the wrong project's automation state.
  const cluster = activeCluster;
  const btn = document.getElementById('toggleBtn');
  const newState = !cluster.enabled;
  btn.disabled = true;
  try {
    const res = await fetch(`/api/toggles/${cluster.toggleId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: newState })
    });
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const data = await res.json();
    cluster.enabled = data.enabled;
    if (activeCluster === cluster) updateToggleBtn();
    loadClusters();
  } catch (e) {
    // Every other write/read in this file shows a real error instead of
    // silently doing nothing (errorBanner, the chat "Error reaching the
    // assistant" bubble); this toggle was the one write path that didn't,
    // leaving a failed click looking identical to a successful one.
    if (activeCluster === cluster) {
      btn.textContent = "Couldn't update, try again";
      btn.style.color = statusColor('broken');
      setTimeout(() => { if (activeCluster === cluster) updateToggleBtn(); }, 2400);
    }
  } finally {
    if (activeCluster === cluster) btn.disabled = false;
  }
});

document.getElementById('closeModal').addEventListener('click', closeModalAndReturnFocus);
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModalAndReturnFocus();
});

function appendMessage(role, text) {
  const div = document.createElement('div');
  div.className = role === 'user' ? 'text-right' : 'text-left';
  const span = document.createElement('span');
  span.className = 'inline-block px-3 py-2 rounded-lg max-w-[85%]';
  span.style.cssText = role === 'user' ? 'background: var(--ink); color: var(--void);' : 'background: var(--panelLight); color: var(--ink);';
  span.textContent = text;
  div.appendChild(span);
  document.getElementById('chatMessages').appendChild(div);
  document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
}

// A real round trip to the Anthropic API takes long enough that, with no
// feedback at all, hitting Send looks like it did nothing. Reuses the same
// pulse animation as the graph's own loading skeleton.
function showTypingIndicator() {
  const div = document.createElement('div');
  div.className = 'text-left';
  div.id = 'typingIndicator';
  const span = document.createElement('span');
  span.className = 'inline-block px-3 py-2 rounded-lg skeleton-pulse';
  span.style.cssText = 'background: var(--panelLight); color: var(--sub);';
  span.textContent = '...';
  div.appendChild(span);
  document.getElementById('chatMessages').appendChild(div);
  document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendChat');
  const text = input.value.trim();
  if (!text || !activeCluster) return;
  const clusterId = activeCluster.id;
  const sessionId = chatSessionId;
  input.value = '';
  appendMessage('user', text);
  chatHistory.push({ role: 'user', content: text });

  input.disabled = true;
  sendBtn.disabled = true;
  showTypingIndicator();

  try {
    const res = await fetch(`/api/clusters/${clusterId}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chatHistory })
    });
    const data = await res.json();
    // The modal may have moved on to a different project (or closed and
    // reopened the same one, which also resets chatHistory) while this was
    // in flight. Applying it now would append a reply into the wrong
    // conversation and corrupt whatever chatHistory currently holds.
    if (sessionId !== chatSessionId) return;
    removeTypingIndicator();
    if (data.text) {
      appendMessage('assistant', data.text);
      chatHistory.push({ role: 'assistant', content: data.text });
    } else {
      appendMessage('assistant', 'Error reaching the assistant.');
    }
  } catch (e) {
    if (sessionId !== chatSessionId) return;
    removeTypingIndicator();
    appendMessage('assistant', 'Error reaching the assistant.');
  } finally {
    if (sessionId === chatSessionId) {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }
}

document.getElementById('sendChat').addEventListener('click', sendChat);
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  // e.isComposing (plus the keyCode 229 fallback some browsers still use
  // instead of setting isComposing) is true while an IME is still resolving
  // a candidate, e.g. typing Chinese/Japanese/Korean: the Enter that
  // confirms the candidate would otherwise also fire this and send the
  // message mid-composition.
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) sendChat();
});

document.addEventListener('keydown', (e) => {
  const modalOpen = !document.getElementById('modalOverlay').classList.contains('hidden');

  // Ctrl+K on Windows/Linux, Cmd+K on Mac, the same convention Linear/Vercel/
  // GitHub all use for their own jump-to palettes. Toggles closed if already
  // open; ignored while the project modal is open rather than stacking two
  // overlays and their two separate focus traps on top of each other.
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (paletteOpen) closePalette();
    else if (!modalOpen) openPalette();
    return;
  }

  if (paletteOpen) {
    if (e.key === 'Escape') { e.preventDefault(); closePalette(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); paletteMove(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); paletteMove(-1); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      const target = paletteResultsCache[paletteSelectedIndex];
      if (target) activatePaletteItem(target.id);
      return;
    }
    // Anything else (typing a search term, including "/") reaches paletteInput
    // normally instead of triggering the "/"-focuses-search shortcut below.
    return;
  }

  if (modalOpen && e.key === 'Escape') {
    closeModalAndReturnFocus();
    return;
  }
  if (modalOpen && e.key === 'Tab') {
    const focusable = getModalFocusable();
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
    return;
  }
  if (!modalOpen && e.key === '/' && document.activeElement.id !== 'searchInput' && document.activeElement.id !== 'chatInput') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

loadClusters();
let lastLoadAt = Date.now();
setInterval(() => {
  if (document.hidden) return;
  lastLoadAt = Date.now();
  loadClusters();
}, 30000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - lastLoadAt > 5000) {
    lastLoadAt = Date.now();
    loadClusters();
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
}
</script>
</body>
</html>
