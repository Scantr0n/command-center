<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#08090A"/>
  <!-- This feeds icon-512.png, which the manifest marks purpose "any maskable":
       Android (and other maskable-aware platforms) crop a maskable icon to a
       circle/squircle centered on it, guaranteeing only the inner 80%-diameter
       circle survives. Everything below is scaled 0.82x about the center so
       its farthest point sits inside that safe-zone radius (12.8 of 16 units)
       with margin, instead of the un-padded glyph's dots (which reached 14.6)
       getting sliced in half on install. -->
  <g transform="translate(16,16) scale(0.82) translate(-16,-16)">
    <line x1="16" y1="16" x2="26" y2="9" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.55"/>
    <line x1="16" y1="16" x2="7" y2="24" stroke="#4F9FD9" stroke-width="1" stroke-opacity="0.55"/>
    <line x1="16" y1="16" x2="24" y2="23" stroke="#D9A441" stroke-width="1" stroke-opacity="0.55"/>
    <circle cx="26" cy="9" r="2.4" fill="#3DDC84"/>
    <circle cx="7" cy="24" r="2" fill="#4F9FD9"/>
    <circle cx="24" cy="23" r="2" fill="#D9A441"/>
    <circle cx="16" cy="16" r="5.5" fill="none" stroke="#9A9FA6" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="2.6" fill="#F5F6F7"/>
  </g>
</svg>
